name: Content Ingestion & Health Sync Worker

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:      # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/worker_content_sync.py'
      - 'templates/**'
      - 'parts/**'
      - 'patterns/**'

permissions:
  contents: write

concurrency:
  group: content-sync-worker
  cancel-in-progress: false

jobs:
  sync-audit:
    name: Audit & Sync WordPress CMS Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest & Map Canonical App Tokens
        run: |
          python3 scripts/sync_tokens_from_app.py

      - name: Run Content Sync & Ingestion Audit
        env:
          WP_BASE_URL: 'https://musiclinkd.com'
          WP_INGEST_USER: ${{ secrets.WP_INGEST_USER || 'ingest' }}
          WP_INGEST_PASS: ${{ secrets.WP_INGEST_PASS }}
        run: |
          python3 scripts/worker_content_sync.py

      - name: Ingest & Sync App Creators to WordPress SCF
        env:
          WP_BASE_URL: 'https://musiclinkd.com'
          WP_INGEST_USER: ${{ secrets.WP_INGEST_USER || 'ingest' }}
          WP_INGEST_PASS: ${{ secrets.WP_INGEST_PASS }}
          SUPABASE_URL: 'https://gsqeymhtyzepwcnorjun.supabase.co'
          SUPABASE_KEY: 'sb_publishable_ytTnZ4VL6Ms_QuwsSuQvWg_uMuLhvnr'
        run: |
          python3 scripts/sync_creators_from_app.py

      - name: Commit & Push Health Log & Theme Updates
        run: |
          git config user.name "musiclinkd-ingest-bot[bot]"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add docs/logs/sync-health.json docs/logs/creators-sync.json theme.json assets/css/ parts/ patterns/
          if ! git diff --cached --quiet; then
            git commit -m "chore(worker): automated content sync & app token ingestion [skip ci]"
            git pull --rebase -X ours origin main || git pull --rebase origin main
            git push origin main
          else
            echo "No sync log or theme token changes to commit."
          fi
