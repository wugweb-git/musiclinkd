<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/opportunities/create_opportunity/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Opportunities / Create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .mvp-banner { background: #E0E7FF; color: #3730A3; font-size: var(--type-1); padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); margin-bottom: var(--space-3); }
  .field textarea { min-height: 88px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--line); background: #fff; font: var(--type-2) 'Inter', sans-serif; resize: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/opportunities/opportunities_home/index.html" aria-label="Close" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div class="mvp-banner">MVP, shipped minimal: title, description, role, budget, location, publish. Richer fields (skills/languages/deadline/opportunity type) are Phase 2.</div>

      <div id="panel-default" style="display:flex;flex-direction:column;gap:var(--space-3);">
        <h1 style="font-size:var(--type-3);margin:0;">Post an opportunity</h1>
        <div class="field"><label for="t">Title</label><input id="t" type="text" value="Indie Rock Vocalist Wanted" /></div>
        <div class="field"><label for="d">Description</label><textarea id="d">Looking for a lead vocalist for a 2-song indie rock session.</textarea></div>
        <div class="field"><label for="r">Role required</label><input id="r" type="text" value="Singer / Vocalist" /></div>
        <div class="field"><label for="b">Budget</label><input id="b" type="text" value="₹15,000 / Session" /></div>
        <div class="field"><label for="l">Location</label><input id="l" type="text" value="Mumbai, MH" /></div>
        <button type="button" class="btn btn-p btn-block" id="publish-btn">Publish opportunity</button>
      </div>

      <div id="panel-publishing" style="display:none;text-align:center;padding-top:20vh;">
        <span class="spinner-circular"></span>
        <p style="color:var(--muted);margin-top:var(--space-3);">Publishing…</p>
      </div>

      <div id="panel-error" style="display:none;text-align:center;padding-top:15vh;">
        <p style="color:var(--err);font-weight:600;">Couldn't publish this opportunity.</p>
        <p style="color:var(--muted);font-size:var(--type-1);margin-top:var(--space-1);">Check your connection and try again.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "publishing") { document.getElementById("panel-default").style.display = "none"; document.getElementById("panel-publishing").style.display = "block"; }
      else if (state === "error") { document.getElementById("panel-default").style.display = "none"; document.getElementById("panel-error").style.display = "block"; }
    });
    document.getElementById("publish-btn")?.addEventListener("click", () => {
      window.location.href = "/preview/flows/opportunities/opportunities_home/index.html";
    });
  </script>
</body>
</html>
