<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/opportunities/create_opportunity/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Opportunities — Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/opportunities/opportunities_home/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Post an opportunity</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="default" data-state-default>
        <div class="ml-field">
          <label for="o-title">Title</label>
          <input id="o-title" type="text" value="Session vocalist — Hindi pop EP" />
        </div>
        <div class="ml-field">
          <label for="o-role">Role</label>
          <select id="o-role"><option>Session vocalist</option><option>Session musician</option><option>Producer</option><option>Mixing engineer</option><option>Composer</option><option>DJ</option></select>
        </div>
        <div class="ml-field">
          <label for="o-budget">Budget (₹)</label>
          <input id="o-budget" type="text" inputmode="numeric" value="12000" />
        </div>
        <div class="ml-field">
          <label for="o-loc">Location</label>
          <input id="o-loc" type="text" value="Andheri West, Mumbai" />
        </div>
        <div class="ml-field">
          <label for="o-brief">Brief</label>
          <textarea id="o-brief" rows="4">Three tracks, two days at our Andheri room.</textarea>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=publishing">Post opportunity</a>
      </div>

      <div class="ml-empty" data-state="publishing" hidden>
        <span class="ml-spinner" role="status" aria-label="Publishing"></span>
        <p class="ml-empty__body" style="margin-top:var(--space-3)">Posting your opportunity…</p>
      </div>

      <div data-state="error" hidden>
        <div class="ml-banner ml-banner--error">
          <span class="ml-banner__body">Couldn't post — a budget is required before this can go live.</span>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Back to the form</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
