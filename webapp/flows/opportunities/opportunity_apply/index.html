<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/opportunities/opportunity_apply/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Opportunities / Apply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#92400E; background:#FEF3C7; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .field textarea { min-height: 96px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--color-line); background: #fff; font: var(--type-2) 'Inter', sans-serif; resize: none; }
  .project-pick { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--color-line); border-radius: var(--radius-2); }
  .project-pick img { width: 40px; height: 40px; border-radius: var(--radius-1); object-fit: cover; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/opportunities/opportunity_detail/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <!-- Phase 2, not MVP: substitutes "Message the poster" in MVP. Needs opportunity_applications collection. Shown as designed. -->
      <span class="status-tag">Phase 2</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div id="panel-default" style="display:flex;flex-direction:column;gap:var(--space-3);">
        <h1 style="font-size:var(--type-3);margin:0;">Apply — Indie Rock Vocalist Wanted</h1>
        <div class="project-pick">
          <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" alt="" />
          <div><b style="font-size:var(--type-1);display:block;">Attach: Tum Hi Toh (Unplugged)</b><span style="font-size:var(--type-1);color:var(--color-muted);">From your portfolio</span></div>
        </div>
        <div class="ml-field"><label for="m">Message to poster</label><textarea id="m">I'd love to be considered — I've done live-take session vocals for 3 years, happy to send a quick demo.</textarea></div>
        <button type="button" class="ml-btn ml-btn--primary ml-btn--block" id="submit-btn">Submit application</button>
      </div>

      <div id="panel-submitting" style="display:none;text-align:center;padding-top:20vh;">
        <span class="ml-spinner"></span>
        <p style="color:var(--color-muted);margin-top:var(--space-3);">Submitting…</p>
      </div>

      <div id="panel-error" style="display:none;text-align:center;padding-top:15vh;">
        <p style="color:var(--color-error);font-weight:600;">Couldn't submit your application.</p>
        <p style="color:var(--color-muted);font-size:var(--type-1);margin-top:var(--space-1);">Check your connection and try again.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "submitting") { document.getElementById("panel-default").style.display = "none"; document.getElementById("panel-submitting").style.display = "block"; }
      else if (state === "error") { document.getElementById("panel-default").style.display = "none"; document.getElementById("panel-error").style.display = "block"; }
      else if (state === "submitted") { document.getElementById("panel-default").style.display = "none"; document.getElementById("panel-submitting").innerHTML = '<p style="color:var(--color-success);font-weight:600;">Application sent</p>'; document.getElementById("panel-submitting").style.display = "block"; }
    });
    document.getElementById("submit-btn")?.addEventListener("click", () => {
      window.location.href = "/preview/flows/opportunities/my_applications/index.html";
    });
  </script>
</body>
</html>
