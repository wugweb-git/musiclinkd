<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/opportunities/my_applications/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Opportunities / My Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#92400E; background:#FEF3C7; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .app-row { padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
  .app-row b { font-size: var(--type-2); display: block; }
  .app-row span { font-size: var(--type-1); color: var(--muted); }
  .status-pill { display: inline-flex; padding: 3px 10px; border-radius: var(--radius-4); font-size: var(--type-1); font-weight: 600; margin-top: var(--space-1); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">My Applications</h1>
      <!-- Phase 2, not MVP. Shown as designed. -->
      <span class="status-tag">Phase 2</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:var(--space-2) var(--space-4) var(--space-4);">

      <div id="panel-list">
        <div class="app-row" data-state-row="submitted"><b>Indie Rock Vocalist Wanted</b><span>The Sound Attic · Applied 2 days ago</span><br /><span class="status-pill" style="background:var(--surface-alt);color:var(--muted);">Submitted</span></div>
        <div class="app-row" data-state-row="shortlisted"><b>Session Guitarist for EP</b><span>Karan Saxena · Applied 5 days ago</span><br /><span class="status-pill" style="background:#FEF3C7;color:#92400E;">Shortlisted</span></div>
        <div class="app-row" style="border-bottom:none;" data-state-row="accepted"><b>Mix Engineer for Live EP</b><span>Aditi Sen · Applied 1 week ago</span><br /><span class="status-pill" style="background:#DCFCE7;color:#166534;">Accepted</span></div>
      </div>

      <div id="panel-empty" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:20vh;gap:var(--space-3);">
        <p style="color:var(--muted);font-size:var(--type-2);">You haven't applied to anything yet.</p>
        <a class="btn btn-p" href="/preview/flows/opportunities/opportunities_home/index.html" style="text-decoration:none;">Browse opportunities</a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // states: submitted | viewed | shortlisted | accepted | rejected | empty
    // — highlights the matching row's status when a specific state is
    // requested via ?state=, otherwise shows the mixed list above as-is.
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "empty") {
        document.getElementById("panel-list").style.display = "none";
        document.getElementById("panel-empty").style.display = "flex";
      }
    });
  </script>
</body>
</html>
