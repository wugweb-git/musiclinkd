<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/opportunities/manage_applicants/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Opportunities / Manage Applicants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
.row-actions { display: flex; gap: 6px; flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/opportunities/opportunity_detail/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <!-- Phase 2, not MVP: poster-side view of opportunity_applications. Shown as designed. -->
      <span class="ml-status ml-status--warning" style="margin-left:auto">Phase 2</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <h1 style="font-size:var(--type-3);margin:var(--space-3) 0 var(--space-2);">Indie Rock Vocalist Wanted</h1>

      <div id="panel-default">
        <div class="ml-person-row">
          <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=200" alt="" />
          <div class="meta"><b>Kabir Sethi</b><span>Applied 2 days ago</span></div>
          <div class="row-actions">
            <button type="button" class="ml-icon-btn ml-icon-btn--primary" aria-label="Shortlist"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>
            <button type="button" class="ml-icon-btn ml-icon-btn--muted" aria-label="Reject"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
        <div class="ml-person-row" style="border-bottom:none;">
          <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" alt="" />
          <div class="meta"><b>Aanya Malhotra</b><span>Applied 3 days ago</span></div>
          <div class="row-actions">
            <button type="button" class="ml-icon-btn ml-icon-btn--primary" aria-label="Shortlist"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>
            <button type="button" class="ml-icon-btn ml-icon-btn--muted" aria-label="Reject"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
      </div>

      <div id="panel-empty" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:20vh;gap:var(--space-3);">
        <p style="color:var(--color-muted);font-size:var(--type-2);">No applicants yet.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      if (window.MusicLinkd.currentState === "empty") {
        document.getElementById("panel-default").style.display = "none";
        document.getElementById("panel-empty").style.display = "flex";
      }
    });
  </script>
</body>
</html>
