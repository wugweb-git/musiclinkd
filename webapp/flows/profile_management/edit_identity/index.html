<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/profile_management/edit_identity/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Profile — Identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/profile_management/profile_overview/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Identity</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="editing">
        <div class="ml-field">
        <label for="i-name">Full name</label>
        <input id="i-name" type="text" value="Ishita Rao" />
      </div>
        <div class="ml-field">
        <label for="i-email">Email</label>
        <input id="i-email" type="email" value="ishita@example.com" />
      </div>
        <div class="ml-field">
        <label for="i-phone">Phone</label>
        <input id="i-phone" type="tel" value="+91 98••• ••432" />
      </div>
        <div class="ml-field">
        <label for="i-pronouns">Pronouns</label>
        <select id="i-pronouns"><option>Prefer not to say</option><option>she/her</option><option>he/him</option><option>they/them</option></select>
      </div>
        <p class="ml-type-1" style="color:var(--color-muted);margin-top:var(--space-2)">
          Your email and phone are never shown publicly.
        </p>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=saving">Save changes</a>
      </div>

      <div class="ml-empty" data-state="saving">
        <span class="ml-spinner" role="status" aria-label="Saving"></span>
        <p class="ml-empty__body" style="margin-top:var(--space-3)">Saving…</p>
      </div>

      <div class="ml-empty" data-state="saved">
        <h2 class="ml-empty__title" style="color:var(--color-success)">Saved</h2>
        <p class="ml-empty__body">Your details are up to date.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/profile_management/profile_overview/index.html">Back to profile</a>
      </div>

      <div data-state="error">
        <div class="ml-banner ml-banner--error">
          <span class="ml-banner__body">Couldn't save — that email is already on another account.</span>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=editing">Back to the form</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
