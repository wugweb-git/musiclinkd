<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/profile_management/profile_type_selection/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Profile — Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/profile_management/profile_overview/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Profile type</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">
        This decides which fields your profile asks for. You can change it later without losing anything.
      </p>
      <div role="radiogroup" aria-label="Profile type">
        <div class="ml-choice" role="radio" aria-checked="true" tabindex="0">
          <span class="ml-choice__body">
            <span class="ml-choice__title">Talent</span>
            <span class="ml-choice__meta">You perform, write, produce or engineer</span>
          </span>
          <span class="ml-choice__mark"></span>
        </div>
        <div class="ml-choice" role="radio" aria-checked="false" tabindex="-1">
          <span class="ml-choice__body">
            <span class="ml-choice__title">Band</span>
            <span class="ml-choice__meta">A group with a shared line-up and shows</span>
          </span>
          <span class="ml-choice__mark"></span>
        </div>
        <div class="ml-choice" role="radio" aria-checked="false" tabindex="-1">
          <span class="ml-choice__body">
            <span class="ml-choice__title">Business</span>
            <span class="ml-choice__meta">A studio, label, school or dealer</span>
          </span>
          <span class="ml-choice__mark"></span>
        </div>
        <div class="ml-choice" role="radio" aria-checked="false" tabindex="-1">
          <span class="ml-choice__body">
            <span class="ml-choice__title">Venue</span>
            <span class="ml-choice__meta">A room that hosts live music</span>
          </span>
          <span class="ml-choice__mark"></span>
        </div>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/profile_management/talent_profile_editor/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
