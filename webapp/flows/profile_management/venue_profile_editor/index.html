<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/profile_management/venue_profile_editor/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Profile — Edit venue profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/profile_management/profile_overview/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Edit venue profile</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <!-- The declared state is "visible_if_venue", which is a note that this is the
           venue variant of one editor rather than a state the screen enters.
           Marked here so the contract is honoured and the intent is visible. -->
      <div data-state="visible_if_venue">
        <section class="ml-section-block"><div class="ml-section"><h2>Images</h2></div>
        <div class="ml-upload-grid">
          <div class="ml-upload-grid__item">
            <img src="/assets/img/editorials/291c9c89af5a84fd95b6be0fc51380a8.jpg" alt="" loading="lazy" />
            <button class="ml-upload-grid__remove" type="button" aria-label="Remove avatar"></button>
          </div>
          <div class="ml-upload-grid__item">
            <img src="/assets/img/6/02d124205931695.66c4331e162d1.jpg" alt="" loading="lazy" />
            <button class="ml-upload-grid__remove" type="button" aria-label="Remove cover"></button>
          </div>
          <button class="ml-upload-grid__add" type="button" aria-label="Add an image"></button>
        </div>
        <p class="ml-type-1" style="color:var(--color-muted);margin-top:var(--space-1)">
          Avatar and cover only. Audio and video are added as links.
        </p></section>

        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Basics</h2></div>
        <div class="ml-field">
        <label for="p-name">Venue name</label>
        <input id="p-name" type="text" value="" />
      </div>
        <div class="ml-field">
        <label for="p-tag">Tagline</label>
        <input id="p-tag" type="text" value="" placeholder="220-capacity live room in Lower Parel" />
      </div>
        <div class="ml-field">
        <label for="p-loc">City</label>
        <input id="p-loc" type="text" value="Mumbai" />
      </div>
        <div class="ml-field">
        <label for="p-bio">About</label>
        <textarea id="p-bio" rows="3" placeholder="A few lines in your own voice."></textarea>
      </div></section>

        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>The room</h2></div>
        <div class="ml-field">
        <label for="p-cap">Capacity</label>
        <input id="p-cap" type="text" value="220" />
      </div>
        <div class="ml-field">
        <label for="p-stage">Stage size</label>
        <input id="p-stage" type="text" value="6m × 4m" />
      </div></section>

        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Provided</h2></div>
        <div class="ml-chip-wrap">
        <button type="button" class="ml-chip" aria-pressed="true">PA system</button>
        <button type="button" class="ml-chip" aria-pressed="true">Backline</button>
        <button type="button" class="ml-chip" aria-pressed="true">Lighting</button>
        <button type="button" class="ml-chip" aria-pressed="false">Sound engineer</button>
        <button type="button" class="ml-chip" aria-pressed="true">Green room</button>
      </div></section>

        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Bookings</h2></div>
        <div class="ml-field">
        <label for="p-nights">Typical nights</label>
        <select id="p-nights"><option>Thu–Sat</option><option>Every night</option><option>Weekends only</option></select>
      </div>
        <div class="ml-field">
        <label for="p-fee">Hire fee (₹)</label>
        <input id="p-fee" type="text" value="25000" />
      </div></section>

        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Links</h2></div>
        <a class="ml-action-row" href="/preview/flows/profile_management/external_links_editor/index.html">
        <span class="ml-choice__body">
          <span class="ml-choice__title">External links</span>
          <span class="ml-choice__meta">Spotify, YouTube, SoundCloud, Instagram</span>
        </span>
        <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-right"/></svg>
      </a></section>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/profile_management/profile_overview/index.html">Save profile</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
