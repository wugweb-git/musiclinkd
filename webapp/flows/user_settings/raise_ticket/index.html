<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/user_settings/raise_ticket/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Settings — Contact support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/user_settings/help_center/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Contact support</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="default">
        <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">Support replies within one working day.</p>
        <div class="ml-field">
          <label for="t-kind">Topic</label>
          <select id="t-kind"><option>Bookings</option><option>Payments</option><option>My account</option><option>Marketplace</option><option>Something else</option></select>
        </div>
        <div class="ml-field">
          <label for="t-subject">Subject</label>
          <input id="t-subject" type="text" value="" />
        </div>
        <div class="ml-field">
          <label for="t-body">What happened?</label>
          <textarea id="t-body" rows="4" placeholder="Include a booking reference or listing link if you have one."></textarea>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=submitting">Raise ticket</a>
      </div>

      <div class="ml-empty" data-state="submitting">
        <span class="ml-spinner" role="status" aria-label="Sending"></span>
        <p class="ml-empty__body" style="margin-top:var(--space-3)">Sending…</p>
      </div>

      <div class="ml-empty" data-state="success">
        <h2 class="ml-empty__title" style="color:var(--color-success)">Ticket raised</h2>
        <p class="ml-empty__body">Reference SUP-2291. We'll email you at vedanshu@wugweb.com.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/user_settings/help_center/index.html">Done</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
