<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/user_settings/blocked_accounts/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Settings — Blocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/user_settings/privacy_settings/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Blocked accounts</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="default">
        <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">
          Blocked accounts cannot message you or see your profile. Blocking is immediate, and separate from reporting.
        </p>
        <div class="ml-person-row">
          <img src="/assets/img/editorials/59aa1e490d7f7be8bd6b98e8b9645d31.jpg" alt="" loading="lazy" />
          <span class="meta"><b>Anonymous account</b><p>Blocked 12 Aug</p></span>
          <button class="ml-btn ml-btn--secondary" type="button">Unblock</button>
        </div>
        <div class="ml-person-row">
          <img src="/assets/img/editorials/8fe517d7b0584d24e1b4a6b10c1c8251.jpg" alt="" loading="lazy" />
          <span class="meta"><b>Loud Gear Rentals</b><p>Business · blocked 2 Aug</p></span>
          <button class="ml-btn ml-btn--secondary" type="button">Unblock</button>
        </div>
      </div>

      <div class="ml-empty" data-state="empty">
        <h2 class="ml-empty__title">No blocked accounts</h2>
        <p class="ml-empty__body">You can block anyone from their profile, or from a conversation.</p>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
