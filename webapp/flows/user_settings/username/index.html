<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/user_settings/username/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Settings — Username</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/user_settings/account_settings/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Username</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-field">
          <label for="u-name">Username</label>
          <input id="u-name" type="text" value="ishitarao" />
        </div>
      <p class="ml-type-1" style="color:var(--color-muted);margin:var(--space-1) 0 0">
        Your profile will be at musiclinkd.com/ishitarao
      </p>

      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Rules</h2></div>
      <div class="ml-summary">
        <div class="ml-summary__row"><span>Length</span><span>3–30 characters</span></div>
        <div class="ml-summary__row"><span>Allowed</span><span>letters, numbers, full stops</span></div>
        <div class="ml-summary__row"><span>Changes</span><span>once every 30 days</span></div>
      </div>

      <div data-state="checking" style="margin-top:var(--space-3)">
        <div class="ml-banner ml-banner--info"><span class="ml-banner__body">Checking availability…</span></div>
      </div>
      <div data-state="taken" style="margin-top:var(--space-3)">
        <div class="ml-banner ml-banner--error"><span class="ml-banner__body">That username is taken. Try ishita.rao or ishitaraomusic.</span></div>
      </div>
      <div data-state="saved" style="margin-top:var(--space-3)">
        <div class="ml-banner ml-banner--success"><span class="ml-banner__body">Saved. Your old link redirects for 30 days.</span></div>
      </div></section>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="?state=saved">Save username</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
