<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/user_settings/report_user/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Settings — Report account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/communication/networking_feed_artist_profile/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Report account</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="default" data-state-default>
        <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">Reporting is anonymous. Blocking is immediate and separate from this report.</p>
        <div class="ml-field">
          <label for="ru-reason">Reason</label>
          <select id="ru-reason"><option>Harassment</option><option>Impersonation</option><option>Spam</option><option>Payment dispute</option><option>Something else</option></select>
        </div>
        <div class="ml-field">
          <label for="ru-body">What happened?</label>
          <textarea id="ru-body" rows="4" placeholder="Optional, but it helps us act faster."></textarea>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=submitting">Report account</a>
      </div>

      <div class="ml-empty" data-state="submitting" hidden>
        <span class="ml-spinner" role="status" aria-label="Sending"></span>
        <p class="ml-empty__body" style="margin-top:var(--space-3)">Sending…</p>
      </div>

      <div class="ml-empty" data-state="success" hidden>
        <h2 class="ml-empty__title" style="color:var(--color-success)">Report received</h2>
        <p class="ml-empty__body">We'll review this account. You can block them from their profile at any time.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/communication/networking_feed_artist_profile/index.html">Done</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
