<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/services_availability/studio_services_amenities/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Services — Amenities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/services_availability/service_offerings_editor/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Amenities</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)" tabindex="0">
      <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">
        What a room provides without being asked. These show on your public profile and in search filters.
      </p>
      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>The room</h2></div>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Air conditioning</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Air conditioning" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Natural light</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Natural light" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Step-free access</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Step-free access" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Green room</span></span>
      </label></section>
      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Technical</h2></div>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Green room" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Engineer on site</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Engineer on site" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Backline provided</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Backline provided" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Headphone mixes</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Headphone mixes" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Talkback</span></span>
      </label></section>
      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Practical</h2></div>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Talkback" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Parking</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Parking" aria-checked="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Loading bay</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Loading bay" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Kitchen</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-label="Kitchen" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Open past midnight</span></span>
      </label></section>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/services_availability/service_offerings_editor/index.html">Save amenities</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
