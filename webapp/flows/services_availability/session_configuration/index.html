<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/services_availability/session_configuration/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Services — New service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/services_availability/service_offerings_editor/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">New service</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-field">
        <label for="s-name">Service name</label>
        <input id="s-name" type="text" value="" placeholder="Studio session" />
      </div>
      <div class="ml-field">
        <label for="s-kind">Type</label>
        <select id="s-kind"><option>In person</option><option>Remote</option><option>Either</option></select>
      </div>
      <div class="ml-field">
        <label for="s-len">Typical length</label>
        <select id="s-len"><option>Full day</option><option>Half day</option><option>Per track</option><option>Per hour</option></select>
      </div>
      <div class="ml-field">
        <label for="s-price">Price (₹)</label>
        <input id="s-price" type="text" value="" placeholder="12000" />
      </div>
      <div class="ml-field">
        <label for="s-desc">What's included</label>
        <textarea id="s-desc" rows="3" placeholder="What the person booking actually gets."></textarea>
      </div>

      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Add-ons</h2></div>
      <div class="ml-check-row">
        <span class="ml-choice__body"><span class="ml-choice__title">Engineer</span>
        <span class="ml-choice__meta">₹800/hr</span></span>
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body"><span class="ml-choice__title">Extra revision</span>
        <span class="ml-choice__meta">₹2,000</span></span>
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body"><span class="ml-choice__title">Stems delivery</span>
        <span class="ml-choice__meta">Free</span></span>
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
      </div></section>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/services_availability/service_offerings_editor/index.html">Publish service</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
