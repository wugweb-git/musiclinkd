<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/services_availability/rate_pricing_editor/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Services — Rates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/services_availability/service_offerings_editor/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Rates</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-section"><h2>Base rates</h2></div>
      <div class="ml-field">
        <label for="r-day">Day rate (₹)</label>
        <input id="r-day" type="text" value="12000" />
      </div>
      <div class="ml-field">
        <label for="r-half">Half day (₹)</label>
        <input id="r-half" type="text" value="7000" />
      </div>
      <div class="ml-field">
        <label for="r-track">Per track (₹)</label>
        <input id="r-track" type="text" value="6000" />
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h2>Adjustments</h2></div>
      <div class="ml-check-row">
        <span class="ml-choice__body"><span class="ml-choice__title">Travel outside Mumbai</span>
        <span class="ml-choice__meta">Charged at cost, agreed up front</span></span>
        <button class="ml-switch" type="button" role="switch" aria-checked="true" aria-label="Travel outside Mumbai"></button>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body"><span class="ml-choice__title">Rush turnaround</span>
        <span class="ml-choice__meta">+25% for delivery under 48 hours</span></span>
        <button class="ml-switch" type="button" role="switch" aria-checked="true" aria-label="Rush turnaround"></button>
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h2>Deposit</h2></div>
      <div class="ml-field">
        <label for="r-dep">Deposit taken on booking</label>
        <select id="r-dep"><option>50% of the total</option><option>25% of the total</option><option>A flat ₹5,000</option><option>No deposit</option></select>
      </div>
      <div class="ml-field">
        <label for="r-cancel">Free cancellation window</label>
        <select id="r-cancel"><option>48 hours</option><option>24 hours</option><option>7 days</option><option>No free cancellation</option></select>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/services_availability/service_offerings_editor/index.html">Save rates</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
