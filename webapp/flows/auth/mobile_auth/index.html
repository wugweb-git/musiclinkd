<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/mobile_auth/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Auth / Mobile Number Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .phone-row { display: flex; gap: var(--space-2); }
  .country-code { min-height: 48px; padding: 0 var(--space-2); border-radius: var(--radius-4); border: 1px solid var(--line); background: var(--surface-alt); font-weight: 600; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/auth/welcome/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div>
        <h1 style="font-size:var(--type-3);">Enter your mobile number</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">We'll send a 6-digit code to verify it's you.</p>
      </div>

      <div class="field">
        <label for="phone">Mobile number</label>
        <div class="phone-row">
          <div class="country-code">🇮🇳 +91</div>
          <input id="phone" type="tel" inputmode="numeric" placeholder="98765 43210" style="flex:1;" autocomplete="tel-national" />
        </div>
      </div>

      <a class="btn btn-p btn-block" href="/preview/flows/auth/otp_verification/index.html" style="text-decoration:none;margin-top:var(--space-2);">Send OTP</a>
      <p style="font-size:var(--type-1);color:var(--muted);text-align:center;">Standard SMS rates may apply.</p>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
