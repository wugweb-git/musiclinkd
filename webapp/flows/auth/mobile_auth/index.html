<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/mobile_auth/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Mobile Number Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/auth/welcome/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Enter your mobile number</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">We'll send a 6-digit code to verify it's you.</p>
      </div>
      <div class="ml-field">
        <label for="phone">Mobile number</label>
        <div class="ml-phone">
          <span class="ml-phone__prefix">🇮🇳 +91</span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98765 43210" />
        </div>
      </div>
      <div class="ml-banner ml-banner--info" data-state="default" data-state-default>We never share your number publicly.</div>
      <div class="ml-banner ml-banner--error" role="alert" data-state="error" hidden>
        That doesn't look like a valid Indian mobile number.
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/auth/otp_verification/index.html">Send code</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
