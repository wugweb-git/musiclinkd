<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/email_auth/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Auth / Email Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .tab-row { display: flex; background: var(--surface-2); border-radius: var(--radius-4); padding: 4px; gap: 4px; }
  .tab-btn { flex: 1; text-align: center; padding: var(--space-2) 0; border-radius: var(--radius-4); font-size: var(--type-2); font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: transparent; font-family: inherit; }
  .tab-btn.active { background: #fff; color: var(--black); box-shadow: var(--shadow-1); }
  .error-banner { background: #FEF2F2; color: var(--err); border-radius: var(--radius-2); padding: var(--space-2) var(--space-3); font-size: var(--type-1); display: none; }
  html[data-state="error"] .error-banner { display: block; }
  html[data-state="error"] .field input { border-color: var(--err); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/auth/welcome/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div>
        <h1 style="font-size:var(--type-3);">Welcome back</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">Sign in or create your MusicLinkd account.</p>
      </div>

      <div class="tab-row" role="tablist">
        <button class="tab-btn" id="tab-signup" role="tab">Sign up</button>
        <button class="tab-btn" id="tab-signin" role="tab">Sign in</button>
      </div>

      <p class="error-banner">We couldn't verify those details. Check your email/password and try again.</p>

      <form style="display:flex;flex-direction:column;gap:var(--space-3);" onsubmit="return false;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <a href="#" class="link-text" style="font-size:var(--type-1);align-self:flex-end;">Forgot password?</a>
        <button type="submit" class="btn btn-p btn-block" id="submit-btn">Sign In</button>
      </form>

      <div class="divider-row">or</div>
      <a class="btn btn-s btn-block" href="/preview/flows/auth/google_signin/index.html" style="text-decoration:none;">Continue with Google</a>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // Toggle sign up / sign in copy from ?state= (default "signin"); this is
    // presentation-only, no real auth wired — see the design system README.
    document.addEventListener("musiclinkd:screen-ready", (e) => {
      const state = e.detail && window.MusicLinkd.currentState;
      const isSignup = state === "signup";
      document.getElementById("tab-signup").classList.toggle("active", isSignup);
      document.getElementById("tab-signin").classList.toggle("active", !isSignup);
      document.getElementById("submit-btn").textContent = isSignup ? "Create Account" : "Sign In";
    });
    document.getElementById("tab-signup").addEventListener("click", () => {
      window.location.search = "?state=signup";
    });
    document.getElementById("tab-signin").addEventListener("click", () => {
      window.location.search = "?state=signin";
    });
  </script>
</body>
</html>
