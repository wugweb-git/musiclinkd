<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/google_signin/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Auth / Google Sign-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .account-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--line); cursor: pointer; text-align: left; background: #fff; width: 100%; font-family: inherit; }
  .account-row:hover { background: var(--surface-alt); }
  .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--pink-container); color: var(--pink); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="app-root" style="background:#fff;">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/auth/welcome/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div style="text-align:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" style="margin:0 auto var(--space-2);"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.57-5.17 3.57-8.84z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.12-6.73-4.96H1.27v3.12C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.61H1.27A11.96 11.96 0 000 12c0 1.93.46 3.76 1.27 5.39l4-3.12z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.61l4 3.12C6.22 6.89 8.87 4.77 12 4.77z"/></svg>
        <h1 style="font-size:var(--type-3);">Choose an account</h1>
        <p style="color:var(--muted);font-size:var(--type-2);">to continue to MusicLinkd</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:var(--space-2);">
        <button class="account-row" type="button">
          <div class="avatar-circle">VB</div>
          <div>
            <div style="font-weight:600;">Vedanshu Beats</div>
            <div style="font-size:var(--type-1);color:var(--muted);">hello@vedanshubeats-mock.example</div>
          </div>
        </button>
        <button class="account-row" type="button">
          <div class="avatar-circle" style="background:var(--surface-2);color:var(--muted);">+</div>
          <div style="font-weight:600;">Use another account</div>
        </button>
      </div>

      <p style="font-size:var(--type-1);color:var(--muted);text-align:center;">To continue, Google will share your name, email address, and profile picture with MusicLinkd.</p>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
