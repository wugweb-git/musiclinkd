<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/welcome/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Welcome (choose auth method)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />

<link rel="stylesheet" href="/guide/system/ml-fixes.css" />

</head>
<body>

  <div class="ml-app">
    <main class="ml-app__body" style="display:flex;flex-direction:column;justify-content:center;gap:var(--space-4)">
      <div style="text-align:center">
        <h1 class="ml-wordmark" style="font-size:var(--type-6);margin:0">MUSIC<em>LINKD</em></h1>
        <p class="ml-type-3" style="color:var(--color-muted);margin-top:var(--space-2)">Discover, collaborate, and get booked — India's network for musicians, studios, and bands.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-2)">
        <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/auth/email_auth/index.html?state=signup">Get started with email</a>
        <a class="ml-btn ml-btn--secondary ml-btn--block" href="/preview/flows/auth/mobile_auth/index.html">Continue with mobile</a>
        <div class="ml-divider ml-divider--labelled">or</div>
        <a class="ml-btn ml-btn--secondary ml-btn--block" href="/preview/flows/auth/google_signin/index.html">
          <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-google"/></svg>
          Continue with Google
        </a>
      </div>
      <p class="ml-type-1" style="color:var(--color-muted);text-align:center">By continuing you agree to our Terms and Privacy Policy.</p>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
