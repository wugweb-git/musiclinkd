<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/auth/welcome/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Auth / Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
</head>
<body>
  <div class="app-root">
    <header class="app-topbar"></header>
    <main class="app-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);padding:var(--space-4);">
      <div style="text-align:center;">
        <div class="brand-wordmark" style="font-size:var(--type-4);">MusicLink<em>d</em></div>
        <p style="color:var(--muted);margin-top:var(--space-2);">Discover, collaborate, and get booked — India's network for musicians, studios, and bands.</p>
      </div>

      <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:var(--space-2);">
        <a class="btn btn-p btn-block" href="/preview/flows/auth/email_auth/index.html?state=signup" style="text-decoration:none;">Get Started with Email</a>
        <a class="btn btn-s btn-block" href="/preview/flows/auth/mobile_auth/index.html" style="text-decoration:none;">Continue with Mobile</a>
        <div class="divider-row">or</div>
        <a class="btn btn-s btn-block" href="/preview/flows/auth/google_signin/index.html" style="text-decoration:none;gap:var(--space-2);">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.57-5.17 3.57-8.84z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.12-6.73-4.96H1.27v3.12C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.61H1.27A11.96 11.96 0 000 12c0 1.93.46 3.76 1.27 5.39l4-3.12z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.61l4 3.12C6.22 6.89 8.87 4.77 12 4.77z"/></svg>
          Continue with Google
        </a>
      </div>

      <p style="font-size:var(--type-1);color:var(--muted);text-align:center;">
        Already have an account? <a href="/preview/flows/auth/email_auth/index.html?state=signin" class="link-text">Sign in</a>
      </p>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <p style="font-size:var(--type-1);color:var(--muted);text-align:center;">By continuing, you agree to MusicLinkd's Terms & Privacy Policy.</p>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
