<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/filters/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking / Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .sheet-handle { width: 36px; height: 4px; background: var(--color-line); border-radius: 2px; margin: var(--space-2) auto; }
  .filter-section { padding: var(--space-3) 0; border-bottom: 1px solid var(--color-line); }
  .filter-section h3 { font-size: var(--type-2); margin: 0 0 var(--space-2); }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .range-row { display: flex; align-items: center; gap: var(--space-2); }
  .range-row input[type="range"] { flex: 1; }
  .range-val { font-size: var(--type-1); color: var(--color-muted); min-width: 64px; text-align: right; }
</style>
</head>
<body>
  <div class="app-root">
    <div class="sheet-handle"></div>
    <header class="app-topbar" style="padding:0 var(--space-4);height:48px;display:flex;align-items:center;justify-content:space-between;">
      <h1 style="font-size:var(--type-3);">Filters</h1>
      <a href="/preview/flows/booking/search_results/index.html" style="font-size:var(--type-1);color:var(--color-muted);text-decoration:none;">Reset</a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div class="filter-section">
        <h3>Price per hour</h3>
        <div class="range-row"><input type="range" min="1000" max="10000" value="6000" aria-label="Maximum price per hour in rupees" /><span class="range-val">Up to ₹6,000</span></div>
      </div>
      <div class="filter-section">
        <h3>Distance</h3>
        <div class="range-row"><input type="range" min="1" max="25" value="8" aria-label="Maximum distance in kilometres" /><span class="range-val">8 km</span></div>
      </div>
      <div class="filter-section">
        <h3>Amenities</h3>
        <div class="chip-wrap">
          <button type="button" class="ml-chip sel" style="background:var(--color-ink);border-color:var(--color-ink);color:#fff;">Dolby Atmos</button>
          <button type="button" class="ml-chip">Live Room</button>
          <button type="button" class="ml-chip">Resident Engineers</button>
          <button type="button" class="ml-chip">Valet Parking</button>
          <button type="button" class="ml-chip">Isolation Booth</button>
        </div>
      </div>
      <div class="filter-section" style="border-bottom:none;">
        <h3>Services</h3>
        <div class="chip-wrap">
          <button type="button" class="ml-chip sel" style="background:var(--color-ink);border-color:var(--color-ink);color:#fff;">Recording</button>
          <button type="button" class="ml-chip">Mixing</button>
          <button type="button" class="ml-chip">Mastering</button>
        </div>
      </div>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);display:flex;gap:var(--space-2);">
      <button type="button" class="ml-btn ml-btn--secondary" style="flex:1;">Reset</button>
      <a class="ml-btn ml-btn--primary" style="flex:1;text-decoration:none;text-align:center;" href="/preview/flows/booking/search_results/index.html">Show 6 studios</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.querySelectorAll(".chip-wrap").forEach((wrap) => {
      wrap.addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        const sel = btn.classList.toggle("sel");
        btn.style.background = sel ? "var(--color-ink)" : "";
        btn.style.borderColor = sel ? "var(--color-ink)" : "";
        btn.style.color = sel ? "#fff" : "";
      });
    });
  </script>
</body>
</html>
