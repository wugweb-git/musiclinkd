<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/filters/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking — Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/booking/studio_discovery/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0">Filters</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-section"><h3>Service</h3></div>
      <div class="ml-chip-wrap">
        <button type="button" class="ml-chip" aria-pressed="true">Tracking</button>
        <button type="button" class="ml-chip" aria-pressed="false">Mixing</button>
        <button type="button" class="ml-chip" aria-pressed="false">Mastering</button>
        <button type="button" class="ml-chip" aria-pressed="false">Rehearsal</button>
        <button type="button" class="ml-chip" aria-pressed="true">Andheri</button>
        <button type="button" class="ml-chip" aria-pressed="false">Bandra</button>
        <button type="button" class="ml-chip" aria-pressed="false">Lower Parel</button>
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h3>Hourly rate</h3>
        <span class="ml-section__link">up to ₹2,500</span></div>
      <input class="ml-slider" type="range" min="500" max="5000" step="100" value="2500" aria-label="Maximum hourly rate" />

      <div class="ml-section" style="margin-top:var(--space-3)"><h3>Distance</h3>
        <span class="ml-section__link">within 8 km</span></div>
      <input class="ml-slider" type="range" min="1" max="25" value="8" aria-label="Maximum distance in kilometres" />
    </main>
    <footer class="ml-app__footer" style="display:flex;gap:var(--space-2)">
      <button class="ml-btn ml-btn--secondary" type="reset" style="flex:1">Reset</button>
      <a class="ml-btn ml-btn--primary" style="flex:1" href="/preview/flows/booking/search_results/index.html">Show studios</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
