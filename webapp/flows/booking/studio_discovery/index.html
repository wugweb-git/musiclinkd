<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/studio_discovery/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking / Studio Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .search-row { display: flex; align-items: center; gap: var(--space-2); }
  .search-row input { flex: 1; min-height: 44px; border-radius: var(--radius-4); border: 1px solid var(--color-line); padding: 0 var(--space-3); font: var(--type-2) 'Inter', sans-serif; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: var(--space-4) 0 var(--space-2); }
  .section-h a { font-size: var(--type-1); color: var(--color-pink); font-weight: 600; text-decoration: none; }
  .studio-rail { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: 4px; }
  .studio-card { flex: none; width: 220px; border: 1px solid var(--color-line); border-radius: var(--radius-2); overflow: hidden; text-decoration: none; color: inherit; }
  .studio-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .studio-card .body { padding: var(--space-2); }
  .studio-card b { font-size: var(--type-2); display: block; }
  .studio-card .loc { font-size: var(--type-1); color: var(--color-muted); }
  .studio-card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-1); font-size: var(--type-1); }
  .gold-badge { display: inline-flex; align-items: center; gap: 3px; background: color-mix(in srgb, var(--color-warning) 18%, var(--color-white)); color: color-mix(in srgb, var(--color-warning) 50%, black); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-4); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding:0 var(--space-4);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">Find a studio</h1>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div class="search-row">
        <input type="search" placeholder="Search studios, city, area…" aria-label="Search studios by name, city or area" />
        <a class="ml-icon-btn" href="/preview/flows/booking/filters/index.html" aria-label="Filters">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </a>
      </div>

      <div class="section-h"><h2 style="font-size:var(--type-2);margin:0;">Featured</h2><a href="/preview/flows/booking/search_results/index.html">See all</a></div>
      <div class="studio-rail">
        <a class="studio-card" href="/preview/flows/booking/studio_profile/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600" alt="" />
          <div class="body">
            <b>Yash Raj Sound Studios</b>
            <span class="loc">Andheri West, Mumbai</span>
            <div class="meta"><span>★ 4.9 (188)</span><span class="gold-badge">Gold</span></div>
          </div>
        </a>
        <a class="studio-card" href="/preview/flows/booking/studio_profile/index.html">
          <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=600" alt="" />
          <div class="body">
            <b>Blue Note Recording Co.</b>
            <span class="loc">Bandra, Mumbai</span>
            <div class="meta"><span>★ 4.6 (94)</span><span style="color:var(--color-muted);">₹5,500/hr</span></div>
          </div>
        </a>
      </div>

      <div class="section-h"><h2 style="font-size:var(--type-2);margin:0;">Nearby</h2><a href="/preview/flows/booking/search_results/index.html">See all</a></div>
      <div class="studio-rail">
        <a class="studio-card" href="/preview/flows/booking/studio_profile/index.html">
          <img src="https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=600" alt="" />
          <div class="body">
            <b>Andheri Live Room</b>
            <span class="loc">Andheri East, Mumbai</span>
            <div class="meta"><span>★ 4.4 (52)</span><span style="color:var(--color-muted);">₹3,200/hr</span></div>
          </div>
        </a>
        <a class="studio-card" href="/preview/flows/booking/studio_profile/index.html">
          <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=600" alt="" />
          <div class="body">
            <b>Powai Sound Works</b>
            <span class="loc">Powai, Mumbai</span>
            <div class="meta"><span>★ 4.7 (66)</span><span style="color:var(--color-muted);">₹4,800/hr</span></div>
          </div>
        </a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
