<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/my_bookings/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking / My Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .my-tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--color-line); }
  .my-tabs button { flex: 1; text-align: center; padding: var(--space-2) 0; font-size: var(--type-1); font-weight: 600; color: var(--color-muted); background: none; border: none; border-bottom: 2px solid transparent; font-family: inherit; }
  .my-tabs button.active { color: var(--color-ink); border-color: var(--color-ink); }
  .booking-card { display: flex; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--color-line); text-decoration: none; color: inherit; }
  .booking-card img { width: 64px; height: 64px; border-radius: var(--radius-2); object-fit: cover; flex: none; }
  .booking-card b { font-size: var(--type-2); display: block; }
  .status-pill { display: inline-flex; padding: 2px 8px; border-radius: var(--radius-4); font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">My Bookings</h1>
    </header>
    <nav class="my-tabs" id="tabs">
      <button type="button" class="active" data-t="upcoming">Upcoming</button>
      <button type="button" data-t="past">Past</button>
      <button type="button" data-t="cancelled">Cancelled</button>
    </nav>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div id="panel-upcoming">
        <a class="booking-card" href="/preview/flows/booking/booking_success/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" alt="" />
          <div>
            <b>Yash Raj Sound Studios — Tracking Room 1</b>
            <span style="font-size:var(--type-1);color:var(--color-muted);">Tue, 12 Aug 2026 · 10:00 AM – 2:00 PM</span>
            <span class="ml-status ml-status--success">Confirmed</span>
          </div>
        </a>
      </div>

      <div id="panel-past" style="display:none;">
        <div class="booking-card" style="border-bottom:none;">
          <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=300" alt="" />
          <div>
            <b>Blue Note Recording Co.</b>
            <span style="font-size:var(--type-1);color:var(--color-muted);">Fri, 18 Jul 2026 · 6:00 PM – 9:00 PM</span>
            <span class="ml-status" style="background:var(--color-surface);color:var(--color-muted);">Completed</span>
          </div>
        </div>
      </div>

      <div id="panel-cancelled" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:20vh;gap:var(--space-3);">
        <p style="color:var(--color-muted);font-size:var(--type-2);">No cancelled bookings.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      ["upcoming", "past", "cancelled"].forEach((t) => {
        const el = document.getElementById("panel-" + t);
        el.style.display = t === btn.dataset.t ? (t === "cancelled" ? "flex" : "block") : "none";
      });
    });
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state && state !== "upcoming") document.querySelector(`#tabs button[data-t="${state}"]`)?.click();
    });
  </script>
</body>
</html>
