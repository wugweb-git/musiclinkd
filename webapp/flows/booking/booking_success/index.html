<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/booking_success/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking / Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#991B1B; background:#FEE2E2; padding:3px 8px; border-radius:999px; position:absolute; top:14px; right:var(--space-3); z-index:2; }
  .check-circle { width: 72px; height: 72px; border-radius: 50%; background: #DCFCE7; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-3); }
  .detail-row { display: flex; justify-content: space-between; padding: var(--space-1) 0; font-size: var(--type-1); }
  .detail-row span:first-child { color: var(--color-muted); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding:0 var(--space-3);height:56px;display:flex;align-items:center;">
      <!-- Real bug, confirmed on last verification pass: the write here still uses artistUserId/totalCostAmount/statusKey instead of the schema's userId/totalAmount/bookingStatus. Screen shown as designed; write path needs a fix, not just this UI. -->
      <span class="status-tag">Known write bug</span>
    </header>
    <main class="app-content" style="display:flex;flex-direction:column;justify-content:center;padding:0 var(--space-4);">
      <div class="check-circle">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 style="font-size:var(--type-3);text-align:center;margin:0 0 4px;">Booking confirmed</h1>
      <p style="color:var(--color-muted);text-align:center;font-size:var(--type-2);margin-bottom:var(--space-4);">Yash Raj Sound Studios — Tracking Room 1</p>

      <div style="border:1px solid var(--color-line);border-radius:var(--radius-2);padding:var(--space-3);">
        <div class="detail-row"><span>Date</span><span>Tue, 12 Aug 2026</span></div>
        <div class="detail-row"><span>Time</span><span>10:00 AM – 2:00 PM</span></div>
        <div class="detail-row"><span>Amount paid</span><span>₹5,000 deposit</span></div>
        <div class="detail-row"><span>Payment method</span><span>UPI</span></div>
        <div class="detail-row"><span>Status</span><span style="color:#166534;font-weight:600;">Confirmed</span></div>
      </div>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/booking/my_bookings/index.html" style="text-decoration:none;">View my bookings</a>
      <a class="ml-btn ml-btn--secondary ml-btn--block" href="/preview/flows/booking/studio_discovery/index.html" style="text-decoration:none;">Back to studios</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
