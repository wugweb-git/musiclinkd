<!-- 24-type-renumber: applied 2026-09-11 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/booking_summary/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking — Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/booking/configure_session/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Review booking</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <!-- Booking-critical: studio + room + date/time must never truncate, so this
           is a plain stacked header rather than .ml-result (which ellipsizes its
           meta line by design — correct for a search list, wrong for a booking
           the user is about to pay for). Found and fixed 2026-08-30. -->
      <a href="/preview/flows/booking/studio_profile/index.html" style="display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:inherit">
        <img style="width:var(--size-4);height:var(--size-4);border-radius:var(--radius-4);object-fit:cover;flex:none;background:var(--color-surface)" src="/assets/img/6/01e26955706919.598fd42d42f34.png" alt="" loading="lazy" />
        <span style="min-width:0">
          <span class="ml-type-4" style="display:block;font-weight:var(--weight-3)">Yash Raj Sound Studios</span>
          <span class="ml-type-3" style="display:block;margin-top:2px">Tracking Room 1</span>
          <span class="ml-type-1" style="display:block;color:var(--color-muted);margin-top:2px">Wed, 12 Aug · 10:00 AM–2:00 PM</span>
        </span>
      </a>

      <div class="ml-summary" style="margin-top:var(--space-3)">
        <div class="ml-summary__row"><span>Room · 4 hrs</span><span>₹7,200</span></div>
        <div class="ml-summary__row"><span>Engineer · 4 hrs</span><span>₹3,200</span></div>
        <div class="ml-summary__row"><span>Drum kit</span><span>₹1,200</span></div>
        <div class="ml-summary__row"><span>Promo code MONSOON</span><span>−₹1,600</span></div>
        <div class="ml-summary__row ml-summary__row--total"><span>Total</span><span>₹10,000</span></div>
        <p class="ml-summary__note">₹5,000 deposit due now, the balance on the day.</p>
      </div>

      <div class="ml-field" style="margin-top:var(--space-3)">
        <label for="promo">Promo code</label>
        <input id="promo" type="text" value="MONSOON" />
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/booking/payment_screen/index.html">Pay ₹5,000 deposit</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
