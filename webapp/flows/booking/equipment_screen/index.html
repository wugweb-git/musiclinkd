<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/equipment_screen/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking — Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/booking/configure_session/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Equipment</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <section class="ml-section-block"><div class="ml-section"><h3>Included with the room</h3></div>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="true" aria-disabled="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Neumann U87</span><span class="ml-choice__meta">Included</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="true" aria-disabled="true"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Neve 1073 preamp</span><span class="ml-choice__meta">Included</span></span>
      </label></section>

      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h3>Add to the session</h3></div>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Drum kit (Yamaha)</span><span class="ml-choice__meta">₹1,200/session</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Guitar amp (Fender)</span><span class="ml-choice__meta">₹600/session</span></span>
      </label>
      <label class="ml-check-row">
        <span class="ml-check-ctl" role="checkbox" aria-checked="false"></span>
        <span class="ml-choice__body"><span class="ml-choice__title">Grand piano</span><span class="ml-choice__meta">₹2,000/session</span></span>
      </label></section>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/booking/booking_summary/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
