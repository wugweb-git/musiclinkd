<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/equipment_screen/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking / Equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .eq-group { margin-bottom: var(--space-3); }
  .eq-group h3 { font-size: var(--type-1); text-transform: uppercase; letter-spacing: .03em; color: var(--color-muted); margin: 0 0 var(--space-2); }
  .eq-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--color-line); }
  .eq-row b { font-size: var(--type-2); font-weight: 500; }
  .included-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; color: color-mix(in srgb, var(--color-success) 58%, black); background: color-mix(in srgb, var(--color-success) 14%, var(--color-white)); padding: 2px 8px; border-radius: var(--radius-4); flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/booking/studio_profile/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <h1 style="font-size:var(--type-3);margin:var(--space-2) 0 4px;">Equipment</h1>
      <p style="color:var(--color-muted);font-size:var(--type-1);margin-bottom:var(--space-3);">Yash Raj Sound Studios — Sound Lab</p>

      <div class="eq-group">
        <h3>Mixers</h3>
        <div class="eq-row"><b>SSL 9000J 72-Channel Console</b><span class="included-pill">Included</span></div>
      </div>
      <div class="eq-group">
        <h3>Studio monitors</h3>
        <div class="eq-row"><b>Dolby Atmos 7.1.4 PMC Studio Monitors</b><span class="included-pill">Included</span></div>
      </div>
      <div class="eq-group">
        <h3>Microphones</h3>
        <div class="eq-row"><b>Neumann U87 / U47 / Telefunken ELAM 251</b><span class="included-pill">Included</span></div>
      </div>
      <div class="eq-group" style="margin-bottom:0;">
        <h3>Controllers</h3>
        <div class="eq-row" style="border-bottom:none;"><b>Pro Tools HDX (128 Analog Inputs)</b><span class="included-pill">Included</span></div>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
