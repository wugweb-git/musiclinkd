<!-- 24-type-renumber: applied 2026-09-11 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/booking/availability_calendar/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Booking — Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/booking/studio_profile/index.html" aria-label="Back to studio">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Availability</h1>
    </header>
    <nav class="ml-tabs ml-tabs--fill" role="tablist" aria-label="Calendar view" style="margin:0 var(--space-4)">
      <a class="ml-tabs__tab" role="tab" data-chip="monthly" href="?state=monthly">Month</a>
      <a class="ml-tabs__tab" role="tab" data-chip="weekly" href="?state=weekly">Week</a>
      <a class="ml-tabs__tab" role="tab" data-chip="timeline" href="?state=timeline">Day</a>
    </nav>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">

      <div class="ml-calendar" data-state="monthly" data-state-default>
        <div class="ml-calendar__head">
          <span class="ml-calendar__month">August 2026</span>
        </div>
        <div class="ml-calendar__dow">
          <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
        </div>
        <div class="ml-calendar__grid">
          <span></span><span></span><span></span><span></span><span></span>
          <button type="button" class="ml-calendar__day">1</button>
          <button type="button" class="ml-calendar__day">2</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="3 August, unavailable">3</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="4 August, unavailable">4</button>
          <button type="button" class="ml-calendar__day">5</button>
          <button type="button" class="ml-calendar__day">6</button>
          <button type="button" class="ml-calendar__day">7</button>
          <button type="button" class="ml-calendar__day">8</button>
          <button type="button" class="ml-calendar__day">9</button>
          <button type="button" class="ml-calendar__day">10</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="11 August, unavailable">11</button>
          <button type="button" class="ml-calendar__day is-today">12</button>
          <button type="button" class="ml-calendar__day">13</button>
          <button type="button" class="ml-calendar__day">14</button>
          <button type="button" class="ml-calendar__day">15</button>
          <button type="button" class="ml-calendar__day">16</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="17 August, unavailable">17</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="18 August, unavailable">18</button>
          <button type="button" class="ml-calendar__day">19</button>
          <button type="button" class="ml-calendar__day">20</button>
          <button type="button" class="ml-calendar__day">21</button>
          <button type="button" class="ml-calendar__day">22</button>
          <button type="button" class="ml-calendar__day">23</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="24 August, unavailable">24</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="25 August, unavailable">25</button>
          <button type="button" class="ml-calendar__day">26</button>
          <button type="button" class="ml-calendar__day">27</button>
          <button type="button" class="ml-calendar__day">28</button>
          <button type="button" class="ml-calendar__day">29</button>
          <button type="button" class="ml-calendar__day">30</button>
          <button type="button" class="ml-calendar__day">31</button>
        </div>
        <div class="ml-calendar__legend">
          <span><i class="ml-calendar__key ml-calendar__key--sel"></i>Available</span>
          <span><i class="ml-calendar__key ml-calendar__key--blocked"></i>Booked</span>
        </div>
      </div>

      <div data-state="weekly" hidden>
        <h2 class="ml-type-3" style="margin:0 0 var(--space-2)">Wed 12 August</h2>
        <div class="ml-slots">
          <button type="button" class="ml-slot">09:00 – 11:00</button>
          <button type="button" class="ml-slot" disabled>11:00 – 13:00</button>
          <button type="button" class="ml-slot">13:00 – 15:00</button>
          <button type="button" class="ml-slot">15:00 – 17:00</button>
          <button type="button" class="ml-slot" disabled>17:00 – 19:00</button>
          <button type="button" class="ml-slot">19:00 – 21:00</button>
        </div>
      </div>

      <!-- .ml-timeline's contract is __title/__meta with .is-done/.is-current
           on the item; a booked slot is the "done" marker, the next open one
           is "current". -->
      <ol class="ml-timeline" data-state="timeline" hidden>
        <li class="ml-timeline__item is-current">
          <span class="ml-timeline__title">Open</span>
          <span class="ml-timeline__meta">09:00 – 11:00</span>
        </li>
        <li class="ml-timeline__item is-done">
          <span class="ml-timeline__title">Booked — Tracking Room 1</span>
          <span class="ml-timeline__meta">11:00 – 13:00</span>
        </li>
        <li class="ml-timeline__item">
          <span class="ml-timeline__title">Open</span>
          <span class="ml-timeline__meta">13:00 – 15:00</span>
        </li>
        <li class="ml-timeline__item">
          <span class="ml-timeline__title">Open</span>
          <span class="ml-timeline__meta">15:00 – 17:00</span>
        </li>
        <li class="ml-timeline__item is-done">
          <span class="ml-timeline__title">Booked — Tracking Room 1</span>
          <span class="ml-timeline__meta">17:00 – 19:00</span>
        </li>
        <li class="ml-timeline__item">
          <span class="ml-timeline__title">Open</span>
          <span class="ml-timeline__meta">19:00 – 21:00</span>
        </li>
      </ol>
      <div class="ml-action-bar ml-action-bar--sticky">
        <a class="ml-btn ml-btn--secondary" href="/preview/flows/booking/studio_profile/index.html">Back to studio</a>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/booking/configure_session/index.html">Continue</a>
      </div>

    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
