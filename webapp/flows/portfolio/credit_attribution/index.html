<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/credit_attribution/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Credit Attribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />

<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/portfolio/add_collaborators/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">6/9</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:67%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Credit each collaborator</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">Assign a project role to everyone on this project.</p>
      </div>

      <div class="ml-card ml-card--padded">
        <div class="ml-row" style="padding-top:0">
          <img class="ml-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120" alt="" />
          <span class="ml-row__body"><span class="ml-row__title">You</span><span class="ml-row__meta">Arijit Sen</span></span>
        </div>
        <div class="ml-chip-wrap">
          <button class="ml-chip" aria-pressed="true">Singer</button><button class="ml-chip" aria-pressed="false">Composer</button><button class="ml-chip" aria-pressed="false">Music Director</button><button class="ml-chip" aria-pressed="false">Producer</button>
        </div>
      </div>

      <div class="ml-card ml-card--padded">
        <div class="ml-row" style="padding-top:0">
          <img class="ml-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120" alt="" />
          <span class="ml-row__body"><span class="ml-row__title">Arijit Sen</span><span class="ml-row__meta">Collaborator</span></span>
        </div>
        <div class="ml-chip-wrap">
          <button class="ml-chip" aria-pressed="false">Producer</button><button class="ml-chip" aria-pressed="true">Mix Engineer</button><button class="ml-chip" aria-pressed="false">Mastering Engineer</button><button class="ml-chip" aria-pressed="false">Session Musician</button>
        </div>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/portfolio/media_preview/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>

</html>
