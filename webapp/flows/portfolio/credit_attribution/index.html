<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/credit_attribution/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Portfolio / Credit Attribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .credit-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-2); margin-bottom: var(--space-2); }
  .credit-row img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .credit-row select { flex: 1; min-height: 40px; border-radius: var(--radius-4); border: 1px solid var(--line); padding: 0 var(--space-2); font: var(--type-1) 'Inter', sans-serif; background: #fff; }
  .step-dots { display: flex; gap: 4px; margin-bottom: var(--space-3); }
  .step-dots span { width: 20px; height: 3px; border-radius: 2px; background: var(--line); }
  .step-dots span.done { background: var(--black); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/portfolio/add_collaborators/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);">
      <div class="step-dots"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span></span><span></span></div>
      <div style="margin-bottom:var(--space-1);">
        <h1 style="font-size:var(--type-3);">Credit each collaborator</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">Assign a role from <code>project_roles</code> to everyone added.</p>
      </div>

      <div class="credit-row">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=88" alt="" />
        <div style="flex:1;font-size:var(--type-2);font-weight:600;">You</div>
        <select><option>Singer</option><option>Composer</option><option>Music Director</option><option>Producer</option></select>
      </div>
      <div class="credit-row">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=88" alt="" />
        <div style="flex:1;font-size:var(--type-2);font-weight:600;">Arijit Sen</div>
        <select><option>Producer</option><option selected>Mix Engineer</option><option>Mastering Engineer</option><option>Session Musician</option></select>
      </div>

      <a class="btn btn-p btn-block" href="/preview/flows/portfolio/media_preview/index.html" style="text-decoration:none;margin-top:var(--space-2);">Continue</a>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
