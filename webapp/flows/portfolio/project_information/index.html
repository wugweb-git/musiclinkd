<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/project_information/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Portfolio / Project Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .field textarea { min-height: 88px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--line); background: #fff; color: var(--black); font: var(--type-2) 'Inter', sans-serif; resize: none; }
  .field textarea:focus { border-color: var(--pink); outline: none; }
  .step-dots { display: flex; gap: 4px; margin-bottom: var(--space-3); }
  .step-dots span { width: 20px; height: 3px; border-radius: 2px; background: var(--line); }
  .step-dots span.done { background: var(--black); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/portfolio/choose_project_type/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="step-dots"><span class="done"></span><span class="done"></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div>
        <h1 style="font-size:var(--type-3);">Project information</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">Title and description — matches <code>portfolio_projects.name</code> / <code>.description</code>.</p>
      </div>

      <div class="field">
        <label for="pname">Project name</label>
        <input id="pname" type="text" placeholder="e.g. Tum Hi Toh (Unplugged)" value="Tum Hi Toh (Unplugged)" />
      </div>

      <div class="field">
        <label for="pdesc">Description</label>
        <textarea id="pdesc" placeholder="What is this project? Who's it for?">Acoustic unplugged reinterpretation.</textarea>
      </div>

      <div class="field">
        <label for="prelease">Release date</label>
        <input id="prelease" type="date" value="2026-02-14" />
      </div>

      <a class="btn btn-p btn-block" href="/preview/flows/portfolio/streaming_links/index.html" style="text-decoration:none;margin-top:var(--space-2);">Continue</a>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
