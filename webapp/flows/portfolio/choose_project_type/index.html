<!doctype html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>MusicLinkd — Add Portfolio / Choose Project Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .type-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-3) var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-2); background: #fff; text-decoration: none; color: inherit; text-align: center; min-height: 92px; }
  .type-tile .icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; color: var(--black); }
  .type-tile span { font-size: var(--type-1); font-weight: 600; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/portfolio/portfolio_dashboard/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <h1 style="font-size:var(--type-3);">What are you adding?</h1>
      <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);margin-bottom:var(--space-4);">Choose a project type — from the taxonomy's real <code>project_types</code> set.</p>

      <div class="type-grid">
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg></div>
          <span>Song</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="3"/></svg></div>
          <span>Album</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 16h5"/></svg></div>
          <span>EP</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg></div>
          <span>Podcast</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V6l12-2v12"/></svg></div>
          <span>DJ Mix</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
          <span>Film Score</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
          <span>Commercial Jingle</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 1-7.743 5.743L10 14l-4 4-2-2 4-4 .257-.257A6 6 0 1 1 18 8z"/></svg></div>
          <span>Live Performance</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
          <span>Music Video</span>
        </a>
        <a class="type-tile" href="/preview/flows/portfolio/project_information/index.html">
          <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
          <span>Custom Project</span>
        </a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
