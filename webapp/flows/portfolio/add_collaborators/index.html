<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/add_collaborators/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Collaborators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/portfolio/select_role/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">5/9</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:56%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Add collaborators</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">Optional — who else worked on this with you?</p>
      </div>

      <div class="ml-search">
        <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-search-outline"/></svg>
        <input type="search" placeholder="Search musicians by name" aria-label="Search collaborators" />
      </div>

      <div class="ml-chip-wrap" data-state="selected" hidden>
        <span class="ml-badge ml-badge--accent ml-badge--removable">Arijit Sen<button class="ml-badge__remove" aria-label="Remove Arijit Sen">×</button></span>
      </div>
      <p class="ml-type-1" style="color:var(--color-muted)" data-state="searching" data-state-default>Start typing to find collaborators already on MusicLinkd.</p>

      <div>
        <button class="ml-choice" aria-checked="true" role="checkbox">
          <img class="ml-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120" alt="" />
          <span class="ml-choice__body">
            <span class="ml-choice__title">Arijit Sen</span>
            <span class="ml-choice__meta">Singer · Composer · Mumbai, MH</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
        <button class="ml-choice" aria-checked="false" role="checkbox">
          <img class="ml-avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=120" alt="" />
          <span class="ml-choice__body">
            <span class="ml-choice__title">Mehek Kapoor</span>
            <span class="ml-choice__meta">Session Guitarist · Pune, MH</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--ghost ml-btn--block" href="/preview/flows/portfolio/media_preview/index.html" style="margin-bottom:var(--space-2)">Skip — solo project</a><a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/portfolio/credit_attribution/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
