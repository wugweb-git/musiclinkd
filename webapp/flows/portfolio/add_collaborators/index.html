<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/add_collaborators/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Portfolio / Add Collaborators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .result-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-2); }
  .result-row img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
  .result-row .meta { flex: 1; min-width: 0; }
  .result-row .meta b { display: flex; align-items: center; gap: 4px; font-size: var(--type-2); }
  .result-row .meta span { font-size: var(--type-1); color: var(--muted); }
  .verified-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--success); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .selected-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border-radius: var(--radius-4); background: var(--surface-alt); font-size: var(--type-1); font-weight: 600; }
  .selected-chip button { width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--line); color: var(--black); cursor: pointer; }
  .step-dots { display: flex; gap: 4px; margin-bottom: var(--space-3); }
  .step-dots span { width: 20px; height: 3px; border-radius: 2px; background: var(--line); }
  .step-dots span.done { background: var(--black); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/portfolio/select_role/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="step-dots"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span></span><span></span><span></span></div>
      <div>
        <h1 style="font-size:var(--type-3);">Add collaborators</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">Optional — who else worked on this with you?</p>
      </div>

      <div class="field"><input type="search" placeholder="Search by name" value="Arijit" /></div>

      <div id="panel-searching">
        <a class="result-row" href="#" id="add-arijit" style="text-decoration:none;color:inherit;">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=88" alt="" />
          <div class="meta">
            <b>Arijit Sen <span class="verified-dot"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg></span></b>
            <span>Singer · Composer · Mumbai, MH</span>
          </div>
          <span style="font-size:var(--type-1);font-weight:600;color:var(--pink);">Add</span>
        </a>
      </div>

      <div id="panel-selected" style="display:none;">
        <p style="font-size:var(--type-1);color:var(--muted);margin-bottom:var(--space-1);">Added</p>
        <span class="selected-chip">Arijit Sen <button type="button" aria-label="Remove">×</button></span>
      </div>

      <a class="btn btn-p btn-block" href="/preview/flows/portfolio/credit_attribution/index.html" style="text-decoration:none;margin-top:var(--space-2);">Continue</a>
      <a class="btn btn-s btn-block" href="/preview/flows/portfolio/credit_attribution/index.html" style="text-decoration:none;">Skip — solo project</a>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // states: searching (default) | selected — see screen.json
    document.addEventListener("musiclinkd:screen-ready", () => {
      if (window.MusicLinkd.currentState === "selected") {
        document.getElementById("panel-searching").style.display = "none";
        document.getElementById("panel-selected").style.display = "block";
      }
    });
    document.getElementById("add-arijit").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("panel-searching").style.display = "none";
      document.getElementById("panel-selected").style.display = "block";
    });
  </script>
</body>
</html>
