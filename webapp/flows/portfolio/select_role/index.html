<title>MusicLinkd — Select Your Role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/portfolio/streaming_links/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">4/9</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:44%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Your role on this project</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">From the 11 project roles — separate from your platform-wide primary role.</p>
      </div>
      <div class="ml-chip-wrap">
        <button class="ml-chip" aria-pressed="true">Singer</button><button class="ml-chip" aria-pressed="false">Composer</button><button class="ml-chip" aria-pressed="false">Music Director</button><button class="ml-chip" aria-pressed="false">Producer</button>

        <button class="ml-chip" aria-pressed="false">Mastering Engineer</button><button class="ml-chip" aria-pressed="false">Sound Designer</button><button class="ml-chip" aria-pressed="false">Band Member</button>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/portfolio/add_collaborators/index.html">Continue</a>
