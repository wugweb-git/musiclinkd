<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/profile_project_view/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Portfolio / Published Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .hero-art { height: 220px; border-radius: 0 0 var(--radius-3) var(--radius-3); background: linear-gradient(135deg,#B08968,#7F5539); display: flex; align-items: flex-end; padding: var(--space-4); color: #fff; }
  .stat-row { display: flex; gap: var(--space-4); margin: var(--space-3) 0; }
  .stat-row .stat b { display: block; font-size: var(--type-2); }
  .stat-row .stat span { font-size: var(--type-1); color: var(--muted); }
  .platform-row { display: flex; gap: var(--space-2); }
  .platform-row a { flex: 1; text-align: center; padding: var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-2); font-size: var(--type-1); font-weight: 600; color: var(--black); text-decoration: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="position:absolute;top:0;left:0;right:0;z-index:2;padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="javascript:history.back()" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.85);color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll">
      <div class="hero-art">
        <div>
          <span style="font-size:var(--type-1);font-weight:600;opacity:.85;">SONG · RELEASED</span>
          <h1 style="font-size:var(--type-3);margin:2px 0 0;">Tum Hi Toh (Unplugged)</h1>
        </div>
      </div>
      <div style="padding:var(--space-3) var(--space-4) var(--space-4);">
        <div style="display:flex;align-items:center;gap:var(--space-2);">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=88" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;" />
          <span style="font-size:var(--type-1);font-weight:600;">Arijit Sen</span>
          <span style="font-size:var(--type-1);color:var(--muted);">· Singer</span>
        </div>

        <p style="font-size:var(--type-2);color:var(--muted);margin-top:var(--space-3);">Acoustic unplugged reinterpretation — 4.2M plays on Spotify.</p>

        <div class="stat-row">
          <div class="stat"><b>4,200</b><span>Views</span></div>
          <div class="stat"><b>610</b><span>Likes</span></div>
          <div class="stat"><b>88</b><span>Shares</span></div>
        </div>

        <p style="font-size:var(--type-1);color:var(--muted);margin-bottom:var(--space-2);">Released 14 Feb 2026</p>

        <div class="platform-row">
          <a href="https://open.spotify.com/track/tumhitohunplugged-mock" target="_blank" rel="noopener">Spotify</a>
          <a href="#" onclick="return false;" style="opacity:.4;">Apple Music</a>
        </div>
      </div>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <button type="button" class="btn btn-p btn-block">Like</button>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
