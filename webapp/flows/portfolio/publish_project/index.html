<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/portfolio/publish_project/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Add Portfolio / Publish Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .summary-art { height: 140px; border-radius: var(--radius-2); background: linear-gradient(135deg,#B08968,#7F5539); display: flex; align-items: flex-end; padding: var(--space-2); color: #fff; font-weight: 700; }
  .summary-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: var(--type-1); }
  .summary-row span:first-child { color: var(--muted); }
  .step-dots { display: flex; gap: 4px; margin-bottom: var(--space-3); }
  .step-dots span { width: 20px; height: 3px; border-radius: 2px; background: var(--line); }
  .step-dots span.done { background: var(--black); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/portfolio/media_preview/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="step-dots"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span></div>

      <div id="panel-ready">
        <div>
          <h1 style="font-size:var(--type-3);">Review &amp; publish</h1>
          <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);margin-bottom:var(--space-3);">Last look before this goes on your public portfolio.</p>
        </div>
        <div class="summary-art">Tum Hi Toh (Unplugged)</div>
        <div>
          <div class="summary-row"><span>Type</span><span>Song</span></div>
          <div class="summary-row"><span>Your role</span><span>Singer</span></div>
          <div class="summary-row"><span>Collaborators</span><span>Arijit Sen — Mix Engineer</span></div>
          <div class="summary-row"><span>Release date</span><span>14 Feb 2026</span></div>
          <div class="summary-row"><span>Visibility</span><span>Public</span></div>
        </div>
        <button type="button" class="btn btn-p btn-block" id="publish-btn" style="margin-top:var(--space-3);">Publish project</button>
      </div>

      <div id="panel-publishing" style="display:none;text-align:center;padding-top:20vh;">
        <span class="spinner-circular"></span>
        <p style="color:var(--muted);margin-top:var(--space-3);">Publishing…</p>
      </div>

      <div id="panel-error" style="display:none;text-align:center;padding-top:15vh;">
        <p style="color:var(--err);font-weight:600;">Couldn't publish this project.</p>
        <p style="color:var(--muted);font-size:var(--type-1);margin-top:var(--space-1);">Check your connection and try again.</p>
        <button type="button" class="btn btn-p" style="margin-top:var(--space-3);" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // states: ready (default) | publishing | error — presentation-only per
    // this screen's screen.json note: PortfolioViewModel.publishProject()
    // is still 100% in-memory, not a real write.
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "publishing") {
        document.getElementById("panel-ready").style.display = "none";
        document.getElementById("panel-publishing").style.display = "block";
      } else if (state === "error") {
        document.getElementById("panel-ready").style.display = "none";
        document.getElementById("panel-error").style.display = "block";
      }
    });
    document.getElementById("publish-btn")?.addEventListener("click", () => {
      window.location.href = "/preview/flows/portfolio/success/index.html";
    });
  </script>
</body>
</html>
