<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/notifications/notification_preferences_onboarding/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Notifications — Set up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/dashboard_handoff/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0">Stay in the loop</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <p class="ml-type-2" style="color:var(--color-muted);margin:0 0 var(--space-3)">
        Pick what matters now. You can change any of it later in Settings, and nothing is on by default that you did not choose.
      </p>
      <div class="ml-check-row">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Someone messages me</span>
          
        </span>
        <button class="ml-switch" type="button" role="switch" aria-checked="true" aria-label="Someone messages me"></button>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body">
          <span class="ml-choice__title">An opportunity matches my roles</span>
          
        </span>
        <button class="ml-switch" type="button" role="switch" aria-checked="true" aria-label="An opportunity matches my roles"></button>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body">
          <span class="ml-choice__title">A booking is confirmed or changed</span>
          
        </span>
        <button class="ml-switch" type="button" role="switch" aria-checked="true" aria-label="A booking is confirmed or changed"></button>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Offers on my listings</span>
          
        </span>
        <button class="ml-switch" type="button" role="switch" aria-checked="false" aria-label="Offers on my listings"></button>
      </div>
      <div class="ml-check-row">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Weekly summary by email</span>
          
        </span>
        <button class="ml-switch" type="button" role="switch" aria-checked="false" aria-label="Weekly summary by email"></button>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/notifications/notifications_center/index.html">Done</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
