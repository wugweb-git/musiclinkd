<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/business_profiles/business_owner_insights/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Business — Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/business_profiles/business_overview/index.html" aria-label="Back to profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0">Insights</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <!-- "visible_if_owner" is a note that this is the owner variant of the
           profile, not a state the screen enters. Marked so the contract holds. -->
      <div data-state="visible_if_owner">
        <div class="ml-stat-grid">
          <div class="ml-kpi"><span class="ml-kpi__num">₹4.2L</span>Booked this month<span class="ml-kpi__delta ml-kpi__delta--up">+12%</span></div>
          <div class="ml-kpi"><span class="ml-kpi__num">68%</span>Room utilisation<span class="ml-kpi__delta ml-kpi__delta--up">+5%</span></div>
          <div class="ml-kpi"><span class="ml-kpi__num">3.1k</span>Profile views</div>
          <div class="ml-kpi"><span class="ml-kpi__num">9</span>Open requests</div>
        </div>

        <div class="ml-section" style="margin-top:var(--space-3)"><h3>Utilisation by room</h3></div>
        <div class="ml-progress">
          <span class="ml-progress__title">Tracking Room 1</span>
          <span class="ml-progress__meta">84%</span>
          <span class="ml-progress__track"><span class="ml-progress__fill" style="width:84%"></span></span>
        </div>
        <div class="ml-progress">
          <span class="ml-progress__title">Mix Suite</span>
          <span class="ml-progress__meta">61%</span>
          <span class="ml-progress__track"><span class="ml-progress__fill" style="width:61%"></span></span>
        </div>
        <div class="ml-progress">
          <span class="ml-progress__title">Booth B</span>
          <span class="ml-progress__meta">38%</span>
          <span class="ml-progress__track"><span class="ml-progress__fill" style="width:38%"></span></span>
        </div>

        <div class="ml-section" style="margin-top:var(--space-3)"><h3>Manage</h3></div>
        <a class="ml-action-row" href="/preview/flows/business_profiles/business_team_tab/index.html">
          <span class="ml-choice__body"><span class="ml-choice__title">Team</span>
          <span class="ml-choice__meta">6 people, 2 with booking rights</span></span>
          <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
        </a>
        <a class="ml-action-row" href="/preview/flows/services_availability/rate_pricing_editor/index.html">
          <span class="ml-choice__body"><span class="ml-choice__title">Rates and services</span></span>
          <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
        </a>
        <a class="ml-action-row" href="/preview/flows/reviews/reputation_dashboard/index.html">
          <span class="ml-choice__body"><span class="ml-choice__title">Reputation</span>
          <span class="ml-choice__meta">2 reviews awaiting a reply</span></span>
          <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
        </a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
