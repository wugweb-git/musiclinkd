<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/public_profile/media_gallery/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Profile — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">

<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/public_profile/public_profile_view/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-3" style="margin:0">Gallery</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-masonry" data-state="default" data-state-default>
        <img class="ml-mosaic-tile" src="/assets/img/6/02d124205931695.66c4331e162d1.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/speakers/40a9560dcb1289e6d450c5259060ea79.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/6/0ad951188258241.6599204c7ae25.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/6/01e26955706919.598fd42d42f34.png" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/6/06b1b644260799.580db89c27acd.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/speakers/39d58e826bc4879e514030beb7c7e972.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/speakers/703a51ef4eaab63412c12f2350b8fd8b.jpg" alt="" loading="lazy" />
        <img class="ml-mosaic-tile" src="/assets/img/6/09be4757713549.59e07fd50a027.png" alt="" loading="lazy" />
      </div>

      <div class="ml-empty" data-state="empty" hidden>
        <h2 class="ml-empty__title">Nothing in the gallery yet</h2>
        <p class="ml-empty__body">Images added to a profile or a portfolio piece show up here.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/portfolio/portfolio_dashboard/index.html">Add work</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
