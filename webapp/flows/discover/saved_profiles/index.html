<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/discover/saved_profiles/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Discover / Saved Profiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .saved-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
  .saved-row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; }
  .saved-row .meta { flex: 1; min-width: 0; }
  .saved-row .meta b { font-size: var(--type-2); }
  .saved-row .meta span { display: block; font-size: var(--type-1); color: var(--muted); }
  .unsave-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface-alt); color: var(--pink); display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <h1 style="font-size:var(--type-3);">Saved</h1>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">

      <div id="panel-populated">
        <a class="saved-row" href="/preview/flows/discover/discover_profile_detail/index.html" style="text-decoration:none;color:inherit;">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="" />
          <div class="meta"><b>Arijit Sen</b><span>Singer · Mumbai</span></div>
          <button type="button" class="unsave-btn" aria-label="Remove from saved" onclick="event.preventDefault()"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.1 1.7 6.6 4.6 5.2c2.2-1.1 4.6-.3 5.9 1.4l1.5 1.9 1.5-1.9c1.3-1.7 3.7-2.5 5.9-1.4 2.9 1.4 3.7 4.9 1.9 7.7C18.7 16.65 12 21 12 21z"/></svg></button>
        </a>
        <a class="saved-row" href="/preview/flows/discover/discover_profile_detail/index.html" style="text-decoration:none;color:inherit;">
          <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400" alt="" />
          <div class="meta"><b>Karan Saxena</b><span>Guitarist · New Delhi</span></div>
          <button type="button" class="unsave-btn" aria-label="Remove from saved" onclick="event.preventDefault()"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.1 1.7 6.6 4.6 5.2c2.2-1.1 4.6-.3 5.9 1.4l1.5 1.9 1.5-1.9c1.3-1.7 3.7-2.5 5.9-1.4 2.9 1.4 3.7 4.9 1.9 7.7C18.7 16.65 12 21 12 21z"/></svg></button>
        </a>
        <a class="saved-row" href="/preview/flows/discover/discover_profile_detail/index.html" style="text-decoration:none;color:inherit;border-bottom:none;">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400" alt="" />
          <div class="meta"><b>Siddharth Swar</b><span>Mixing Engineer · Chennai</span></div>
          <button type="button" class="unsave-btn" aria-label="Remove from saved" onclick="event.preventDefault()"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.1 1.7 6.6 4.6 5.2c2.2-1.1 4.6-.3 5.9 1.4l1.5 1.9 1.5-1.9c1.3-1.7 3.7-2.5 5.9-1.4 2.9 1.4 3.7 4.9 1.9 7.7C18.7 16.65 12 21 12 21z"/></svg></button>
        </a>
      </div>

      <div id="panel-empty" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:20vh;gap:var(--space-3);">
        <div style="width:64px;height:64px;border-radius:var(--radius-2);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--muted);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.1 1.7 6.6 4.6 5.2c2.2-1.1 4.6-.3 5.9 1.4l1.5 1.9 1.5-1.9c1.3-1.7 3.7-2.5 5.9-1.4 2.9 1.4 3.7 4.9 1.9 7.7C18.7 16.65 12 21 12 21z"/></svg>
        </div>
        <div>
          <h2 style="font-size:var(--type-3);margin:0;">Nothing saved yet</h2>
          <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);max-width:260px;">Save profiles from Discover to find them again quickly.</p>
        </div>
        <a class="btn btn-p" href="/preview/flows/discover/discover_feed/index.html" style="text-decoration:none;">Go to Discover</a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // states: empty | populated (default) — see screen.json. This screen is
    // real UI reading a real, rules-ready `user_bookmarks` collection - but
    // per its own screen.json note, the connection isn't wired up in the
    // app yet. This preview shows what the wired-up version looks like.
    document.addEventListener("musiclinkd:screen-ready", () => {
      if (window.MusicLinkd.currentState === "empty") {
        document.getElementById("panel-populated").style.display = "none";
        document.getElementById("panel-empty").style.display = "flex";
      }
    });
  </script>
</body>
</html>
