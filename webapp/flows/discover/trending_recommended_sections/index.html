<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#92400E; background:#FEF3C7; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .rail { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-1); }
  .rail-card { flex: none; width: 140px; }
  .rail-card img { width: 140px; height: 140px; border-radius: var(--radius-2); object-fit: cover; display: block; }
  .rail-card b { display: block; font-size: var(--type-1); margin-top: var(--space-1); }
  .rail-card span { font-size: var(--type-1); color: var(--muted); }
  .section-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-2); }
  .section-h a { font-size: var(--type-1); color: var(--pink); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/discover/discover_feed/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <!-- This section's real composables exist in source but their call sites are commented out — not rendered in the live app today. -->
      <span class="status-tag">Hidden in app</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:var(--space-3) var(--space-3) var(--space-4);">
      <div style="margin-bottom:var(--space-4);">
        <div class="section-h"><h2 style="font-size:var(--type-2);margin:0;">Trending Projects</h2><a href="#">See all</a></div>
        <div class="rail">
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" alt="" /><b>Tum Hi Toh (Unplugged)</b><span>4.2K views</span></div>
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" alt="" /><b>Monsoon Sessions Vol. 2</b><span>2.8K views</span></div>
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=300" alt="" /><b>Anjuna Sunset Mix</b><span>1.6K views</span></div>
        </div>
      </div>

      <div>
        <div class="section-h"><h2 style="font-size:var(--type-2);margin:0;">Recommended Collaborators</h2><a href="#">See all</a></div>
        <div class="rail">
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" alt="" /><b>Aarav Mehta</b><span>Synth Producer</span></div>
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" alt="" /><b>Vikramaditya Roy</b><span>Sitar</span></div>
          <div class="rail-card"><img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=300" alt="" /><b>Nikhil Verma</b><span>Live Sound</span></div>
        </div>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
