<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/discover/advanced_filters/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/discover/search_results/index.html" aria-label="Close">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-navbar__title">Filters</h1>
      <span class="ml-navbar__spacer"></span>
      <a class="ml-btn ml-btn--ghost" href="/preview/flows/discover/advanced_filters/index.html?state=default">Reset</a>
    </header>
    <main class="ml-app__body">
      <div>
        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Discovery type</h2></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">People</button><button class="ml-chip" aria-pressed="false">Businesses</button><button class="ml-chip" aria-pressed="false">Spaces</button><button class="ml-chip" aria-pressed="false">Music</button><button class="ml-chip" aria-pressed="false">Services</button><button class="ml-chip" aria-pressed="false">Communities</button></div></section>
      </div>
      <div>
        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Role</h2></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="false">Singer</button><button class="ml-chip" aria-pressed="false">Musician</button><button class="ml-chip" aria-pressed="true">Producer</button><button class="ml-chip" aria-pressed="false">Composer</button><button class="ml-chip" aria-pressed="true">Engineer</button><button class="ml-chip" aria-pressed="false">DJ</button></div></section>
      </div>
      <div>
        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Genre</h2></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">Bollywood / Filmi</button><button class="ml-chip" aria-pressed="false">Indie Pop</button><button class="ml-chip" aria-pressed="false">Hindustani Classical</button><button class="ml-chip" aria-pressed="false">Carnatic</button><button class="ml-chip" aria-pressed="false">Punjabi Folk</button><button class="ml-chip" aria-pressed="false">Sufi</button><button class="ml-chip" aria-pressed="false">Electronic</button></div></section>
      </div>
      <div>
        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Language</h2></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">Hindi</button><button class="ml-chip" aria-pressed="true">English</button><button class="ml-chip" aria-pressed="false">Punjabi</button><button class="ml-chip" aria-pressed="false">Tamil</button><button class="ml-chip" aria-pressed="false">Telugu</button><button class="ml-chip" aria-pressed="false">Bengali</button><button class="ml-chip" aria-pressed="false">Marathi</button></div></section>
      </div>
      <div>
        <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Availability</h2></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">Available now</button><button class="ml-chip" aria-pressed="false">Selective</button><button class="ml-chip" aria-pressed="false">Open to collab</button><button class="ml-chip" aria-pressed="false">Remote OK</button></div></section>
      </div>

      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Distance</h2></div>
      <div class="ml-field">
        <label for="dist">Within 10 km of Andheri West</label>
        <input id="dist" type="range" min="1" max="50" value="10" style="min-height:var(--size-3);padding:0" />
      </div></section>

      <section class="ml-section-block"><div class="ml-section" style="margin-top:var(--space-3)"><h2>Rating</h2></div>
      <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">Any</button><button class="ml-chip" aria-pressed="false"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-star"/></svg> 4.0+</button><button class="ml-chip" aria-pressed="false"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-star"/></svg> 4.5+</button><button class="ml-chip" aria-pressed="false">Verified only</button></div></section>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/discover/search_results/index.html">Show 28 results</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
