<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/discover/discover_feed/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Discover / Discover Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .search-row { display: flex; gap: var(--space-2); align-items: center; }
  .search-row .field { flex: 1; margin: 0; }
  .filter-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--black); flex: none; }
  .tab-scroll { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-1) 0; }
  .tab-scroll .chip { flex: none; }
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .p-card { border: 1px solid var(--line); border-radius: var(--radius-2); overflow: hidden; text-decoration: none; color: inherit; background: #fff; }
  .p-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .p-card .meta { padding: var(--space-2); }
  .p-card b { font-size: var(--type-1); display: flex; align-items: center; gap: 4px; }
  .p-card span { font-size: var(--type-1); color: var(--muted); display: block; margin-top: 2px; }
  .v-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--success); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding:0 var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);padding-top:calc(var(--app-safe-top) + var(--space-2));padding-bottom:var(--space-2);">
      <div class="search-row">
        <div class="field" style="margin:0;"><input type="search" placeholder="Search musicians, studios, projects…" /></div>
        <a class="filter-btn" href="/preview/flows/discover/advanced_filters/index.html" aria-label="Filters">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </a>
      </div>
      <div class="tab-scroll">
        <button type="button" class="chip sel" style="background:var(--black);border-color:var(--black);color:#fff;">People</button>
        <button type="button" class="chip">Businesses</button>
        <button type="button" class="chip">Spaces</button>
        <button type="button" class="chip">Music</button>
        <button type="button" class="chip">Services</button>
      </div>
    </header>
    <main class="app-content app-content--scroll" style="padding:var(--space-1) var(--space-3) var(--space-4);">
      <div class="profile-grid">
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="" />
          <div class="meta"><b>Arijit Sen <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Singer · Mumbai</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400" alt="" />
          <div class="meta"><b>Vedanshu Beats <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Producer · Mumbai</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400" alt="" />
          <div class="meta"><b>Karan Saxena <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Guitarist · New Delhi</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=400" alt="" />
          <div class="meta"><b>DJ Rish</b><span>DJ · Goa</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="" />
          <div class="meta"><b>Rohit Malhotra <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Composer · Mumbai</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400" alt="" />
          <div class="meta"><b>Siddharth Swar <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Mixing Engineer · Chennai</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400" alt="" />
          <div class="meta"><b>Aarav Mehta <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Synth Producer · Mumbai</span></div>
        </a>
        <a class="p-card" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=400" alt="" />
          <div class="meta"><b>Aditi Sen <span class="v-dot"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="5"><path d="M20 6L9 17l-5-5"/></svg></span></b><span>Vocalist · Bengaluru</span></div>
        </a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
