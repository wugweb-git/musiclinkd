<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/discover/global_search/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Global Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/discover/discover_feed/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <div class="ml-search" style="flex:1">
        <span class="ml-search__icon"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-search"/></svg></span>
        <input type="search" placeholder="Search talent, studios, projects…" aria-label="Search MusicLinkd" autofocus />
      </div>
    </header>

    <main class="ml-app__body">
      <!-- The search field is the page's subject, so the heading is visually
           redundant — but a screen still needs one h1 for structure. -->
      <h1 class="ml-visually-hidden">Search MusicLinkd</h1>

      <!-- idle: recent + suggested -->
      <div data-state="idle" data-state-default>
        <section class="ml-section-block"><div class="ml-section"><h2>Recent</h2></div>
        <a class="ml-suggest" href="/preview/flows/discover/search_results/index.html">
          <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-clock"/></svg>
          <span class="ml-suggest__body">mix engineer mumbai</span>
        </a>
        <a class="ml-suggest" href="/preview/flows/discover/search_results/index.html">
          <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-clock"/></svg>
          <span class="ml-suggest__body">jam room andheri</span>
        </a></section>

        <section class="ml-section-block"><div class="ml-section"><h2>Try searching for</h2></div>
        <div class="ml-chip-wrap">
          <button class="ml-chip" aria-pressed="false">Playback vocalists</button><button class="ml-chip" aria-pressed="false">Tabla players</button><button class="ml-chip" aria-pressed="false">Dolby Atmos studios</button>
          <button class="ml-chip" aria-pressed="false">Punjabi lyricists</button><button class="ml-chip" aria-pressed="false">Mastering</button><button class="ml-chip" aria-pressed="false">Bands in Pune</button>
        </div></section>
      </div>

      <!-- typing: live suggestions across dimensions -->
      <div data-state="typing" hidden>
        <p class="ml-type-1" style="color:var(--color-muted);margin:var(--space-2) 0">Results for "mix"</p>
        <a class="ml-suggest" href="/preview/flows/discover/search_results/index.html">
          <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-search"/></svg>
          <span class="ml-suggest__body">mix engineer<span class="ml-suggest__kind">in People</span></span>
        </a>
        <a class="ml-suggest" href="/preview/flows/discover/services/index.html">
          <svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-search"/></svg>
          <span class="ml-suggest__body">mixing &amp; mastering<span class="ml-suggest__kind">in Services</span></span>
        </a>
        <a class="ml-suggest" href="/preview/flows/discover/discover_profile_detail/index.html">
          <img class="ml-avatar ml-avatar--sm" src="/assets/img/editorials/324eae250c23aafe52ea0ef9caab5d5f.jpg" alt="" />
          <span class="ml-suggest__body">Rahul Iyer<span class="ml-suggest__kind">Producer · Mix Engineer</span></span>
        </a>
      </div>

      <!-- no_results -->
      <div class="ml-empty" data-state="no_results" hidden>
        <h2 class="ml-empty__title">Nothing found</h2>
        <p class="ml-empty__body">Try a different spelling, or browse by category instead.</p>
        <a class="ml-btn ml-btn--secondary" href="/preview/flows/discover/discover_feed/index.html">Browse Discover</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
