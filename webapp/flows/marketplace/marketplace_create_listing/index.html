<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_create_listing/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Market — Create listing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/marketplace/marketplace_my_listings/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">New listing</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="default" data-state-default>
        <!-- Images upload; audio and video are links only. Per the media
             decision, so no audio/video dropzone is drawn here. -->
        <div class="ml-upload-grid">
          <div class="ml-upload-grid__item">
            <img src="/assets/img/speakers/0159435ccca405aa6d2c59bb4f11947b.jpg" alt="" loading="lazy" />
            <button class="ml-upload-grid__remove" type="button" aria-label="Remove photo"></button>
          </div>
          <div class="ml-upload-grid__item">
            <img src="/assets/img/speakers/39d58e826bc4879e514030beb7c7e972.jpg" alt="" loading="lazy" />
            <button class="ml-upload-grid__remove" type="button" aria-label="Remove photo"></button>
          </div>
          <div class="ml-upload-grid__item">
            <img src="/assets/img/speakers/5d80bc64883cb1f3ea6a1296c0e459f7.jpg" alt="" loading="lazy" />
            <button class="ml-upload-grid__remove" type="button" aria-label="Remove photo"></button>
          </div>
          <button class="ml-upload-grid__add" type="button" aria-label="Add photo"></button>
        </div>
        <div class="ml-field" style="margin-top:var(--space-3)">
          <label for="l-title">Title</label>
          <input id="l-title" type="text" value="Shure SM7B Microphone" />
        </div>
        <div class="ml-field">
          <label for="l-cat">Category</label>
          <select id="l-cat"><option>Gear Sale</option><option>Gear Rental</option><option>Beats Licensing</option><option>Mixing & Mastering</option><option>Creative Services</option></select>
        </div>
        <div class="ml-field">
          <label for="l-price">Price (₹)</label>
          <input id="l-price" type="text" inputmode="numeric" value="28500" />
        </div>
        <div class="ml-field">
          <label for="l-desc">Description</label>
          <textarea id="l-desc" rows="4">Cardioid dynamic, used on two album sessions.</textarea>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=publishing">Publish listing</a>
        <a class="ml-btn ml-btn--secondary" href="/preview/flows/marketplace/marketplace_my_listings/index.html">View my listings</a>
      </div>

      <div class="ml-empty" data-state="publishing" hidden>
        <span class="ml-spinner" role="status" aria-label="Publishing"></span>
        <p class="ml-empty__body" style="margin-top:var(--space-3)">Publishing your listing…</p>
      </div>

      <div data-state="error" hidden>
        <div class="ml-banner ml-banner--error">
          <span class="ml-banner__body">Couldn't publish — the price field must be a whole number.</span>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Back to the form</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
