<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_create_listing/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Marketplace / Create Listing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#3730A3; background:#E0E7FF; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .type-toggle { display: flex; border: 1px solid var(--color-line); border-radius: var(--radius-4); overflow: hidden; }
  .type-toggle button { flex: 1; padding: var(--space-2); background: #fff; border: none; font: 600 var(--type-2)/1 'Inter', sans-serif; color: var(--color-muted); }
  .type-toggle button.sel { background: var(--color-ink); color: #fff; }
  .photo-add { width: 88px; height: 88px; border: 2px dashed var(--color-line); border-radius: var(--radius-2); display: flex; align-items: center; justify-content: center; color: var(--color-muted); }
  .field textarea { min-height: 72px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--color-line); background: #fff; font: var(--type-2) 'Inter', sans-serif; resize: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/marketplace/marketplace_browse/index.html" aria-label="Close" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </a>
      <!-- MVP, shipped minimal (decided 2026-08-16): title, category, condition, price, one photo, description, publish. Full 8-step flow (gallery, location picker, preview) is Phase 2. -->
      <span class="status-tag">MVP scope</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div id="panel-default" style="display:flex;flex-direction:column;gap:var(--space-3);">
        <h1 style="font-size:var(--type-3);margin:0;">Create a listing</h1>

        <div class="type-toggle" id="listing-type">
          <button type="button" class="sel" data-type="sale">Sell</button>
          <button type="button" data-type="rental">Rent Out</button>
        </div>

        <div class="photo-add"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>

        <div class="ml-field"><label for="title">Title</label><input id="title" type="text" value="Yamaha HS8 Active Studio Monitors (Pair)" /></div>
        <div class="ml-field"><label for="cat">Category</label>
          <select id="cat" style="min-height:48px;border-radius:var(--radius-4);border:1px solid var(--color-line);padding:0 var(--space-3);font:var(--type-2) 'Inter',sans-serif;background:#fff;">
            <option>Gear Sale</option><option>Gear Rental</option><option>Beats Licensing</option><option>Stems</option><option>Mixing &amp; Mastering</option><option>Creative Services</option>
          </select>
        </div>
        <div class="ml-field"><label for="cond">Condition</label>
          <select id="cond" style="min-height:48px;border-radius:var(--radius-4);border:1px solid var(--color-line);padding:0 var(--space-3);font:var(--type-2) 'Inter',sans-serif;background:#fff;">
            <option>New</option><option selected>Like New</option><option>Good</option><option>Fair</option>
          </select>
        </div>
        <div class="ml-field"><label for="price">Price</label><input id="price" type="text" value="₹42,000" /></div>
        <div class="ml-field"><label for="desc">Description</label><textarea id="desc">Lightly used, studio-kept. Selling to fund a room upgrade.</textarea></div>

        <button type="button" class="ml-btn ml-btn--primary ml-btn--block" id="publish-btn">Publish listing</button>
      </div>

      <div id="panel-publishing" style="display:none;text-align:center;padding-top:20vh;">
        <span class="ml-spinner"></span>
        <p style="color:var(--color-muted);margin-top:var(--space-3);">Publishing…</p>
      </div>

      <div id="panel-error" style="display:none;text-align:center;padding-top:15vh;">
        <p style="color:var(--color-error);font-weight:600;">Couldn't publish this listing.</p>
        <p style="color:var(--color-muted);font-size:var(--type-1);margin-top:var(--space-1);">Check your connection and try again.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.getElementById("listing-type").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      document.querySelectorAll("#listing-type button").forEach((b) => b.classList.remove("sel"));
      btn.classList.add("sel");
    });
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "publishing") {
        document.getElementById("panel-default").style.display = "none";
        document.getElementById("panel-publishing").style.display = "block";
      } else if (state === "error") {
        document.getElementById("panel-default").style.display = "none";
        document.getElementById("panel-error").style.display = "block";
      }
    });
    document.getElementById("publish-btn")?.addEventListener("click", () => {
      window.location.href = "/preview/flows/marketplace/marketplace_browse/index.html";
    });
  </script>
</body>
</html>
