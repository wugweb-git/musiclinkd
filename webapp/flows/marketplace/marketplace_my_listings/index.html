<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_my_listings/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Marketplace / My Listings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#92400E; background:#FEF3C7; padding:3px 8px; border-radius:999px; margin-left:auto; }
  .my-tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--color-line); }
  .my-tabs a { flex: 1; text-align: center; padding: var(--space-2) 0; font-size: var(--type-1); font-weight: 600; color: var(--color-muted); text-decoration: none; border-bottom: 2px solid transparent; }
  .my-tabs a.active { color: var(--color-ink); border-color: var(--color-ink); }
  .item-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-line); text-decoration: none; color: inherit; }
  .item-row img { width: 56px; height: 56px; border-radius: var(--radius-1); object-fit: cover; flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">My Marketplace</h1>
      <!-- Phase 2, not MVP. Shown as designed. -->
      <span class="status-tag">Phase 2</span>
    </header>
    <nav class="my-tabs">
      <a href="#" class="active">Listings</a>
      <a href="#">Purchases</a>
      <a href="#">Rentals</a>
    </nav>
    <main class="app-content app-content--scroll" style="padding:var(--space-2) var(--space-4) var(--space-4);">
      <div id="panel-listings">
        <a class="item-row" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="" />
          <div style="flex:1;"><b style="display:block;font-size:var(--type-2);">Yamaha HS8 Studio Monitors</b><span style="font-size:var(--type-1);color:var(--color-muted);">₹42,000 · Active</span></div>
        </a>
        <a class="item-row" href="/preview/flows/marketplace/marketplace_item_detail/index.html" style="border-bottom:none;">
          <img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=200" alt="" />
          <div style="flex:1;"><b style="display:block;font-size:var(--type-2);">Shure SM7B Microphone</b><span style="font-size:var(--type-1);color:var(--color-muted);">₹28,500 · Sold</span></div>
        </a>
      </div>
      <div id="panel-empty" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:20vh;gap:var(--space-3);">
        <p style="color:var(--color-muted);font-size:var(--type-2);">Nothing here yet.</p>
        <a class="btn btn-p" href="/preview/flows/marketplace/marketplace_create_listing/index.html" style="text-decoration:none;">Create a listing</a>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "empty") {
        document.getElementById("panel-listings").style.display = "none";
        document.getElementById("panel-empty").style.display = "flex";
      } else if (state === "purchases" || state === "rentals") {
        document.querySelectorAll(".my-tabs a").forEach((a) => a.classList.remove("active"));
        document.querySelectorAll(".my-tabs a")[state === "purchases" ? 1 : 2].classList.add("active");
      }
    });
  </script>
</body>
</html>
