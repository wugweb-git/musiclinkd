<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_make_offer/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Marketplace / Make Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
.listing-mini { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--color-line); border-radius: var(--radius-2); margin-bottom: var(--space-3); }
  .listing-mini img { width: 48px; height: 48px; border-radius: var(--radius-1); object-fit: cover; }
  .status-banner { justify-content: center; text-align: center; font-weight: 600; margin-bottom: var(--space-3); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/marketplace/marketplace_item_detail/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <!-- Phase 2, not MVP: needs the new offers collection (schema landed 2026-08-16, not yet built into the app). -->
      <span class="ml-status ml-status--warning" style="margin-left:auto">Phase 2</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);">
      <div class="listing-mini">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="" />
        <div><b style="display:block;font-size:var(--type-2);">Yamaha HS8 Studio Monitors</b><span style="font-size:var(--type-1);color:var(--color-muted);">Asking ₹42,000</span></div>
      </div>

      <div id="panel-default">
        <div class="ml-field"><label for="offer">Your offer</label><input id="offer" type="text" value="₹38,000" /></div>
        <div class="ml-field" style="margin-top:var(--space-2);"><label for="msg">Message (optional)</label><input id="msg" type="text" placeholder="Add a note for the seller" /></div>
        <button type="button" class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3);">Send offer</button>
      </div>

      <div id="panel-countered" style="display:none;">
        <div class="status-banner ml-banner ml-banner--warning">Seller countered: ₹40,000</div>
        <div style="display:flex;gap:var(--space-2);"><button type="button" class="ml-btn ml-btn--primary" style="flex:1;">Accept</button><button type="button" class="ml-btn ml-btn--secondary" style="flex:1;">Counter again</button></div>
      </div>

      <div id="panel-accepted" style="display:none;">
        <div class="status-banner ml-banner ml-banner--success">Offer accepted — ₹38,000</div>
        <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/marketplace/marketplace_order_status/index.html" style="text-decoration:none;">Continue to order</a>
      </div>

      <div id="panel-declined" style="display:none;">
        <div class="status-banner ml-banner ml-banner--error">Offer declined</div>
      </div>

      <div id="panel-expired" style="display:none;">
        <div class="status-banner ml-banner ml-banner--info">This offer has expired</div>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state && state !== "default") {
        document.getElementById("panel-default").style.display = "none";
        const el = document.getElementById("panel-" + state);
        if (el) el.style.display = "block";
      }
    });
  </script>
</body>
</html>
