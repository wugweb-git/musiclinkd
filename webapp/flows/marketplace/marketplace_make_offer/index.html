<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_make_offer/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Market — Make an offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/marketplace/marketplace_item_detail/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Make an offer</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <a class="ml-result" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
        <img class="ml-result__thumb" src="/assets/img/speakers/0159435ccca405aa6d2c59bb4f11947b.jpg" alt="" loading="lazy" />
        <span class="ml-result__body">
          <span class="ml-result__name">Shure SM7B Microphone</span>
          <span class="ml-result__meta">Gear Sale · Mumbai</span>
        </span>
        <span class="ml-result__trail">₹28,500</span>
      </a>

      <div data-state="countered" style="margin-top:var(--space-3)" hidden>
        <div class="ml-banner ml-banner--info"><span class="ml-banner__body">Seller countered at ₹26,000.</span></div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Respond or accept</a>
      </div>
      <div data-state="accepted" style="margin-top:var(--space-3)" hidden>
        <div class="ml-banner ml-banner--success"><span class="ml-banner__body">Offer accepted at ₹24,000.</span></div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Continue to payment</a>
      </div>
      <div data-state="declined" style="margin-top:var(--space-3)" hidden>
        <div class="ml-banner ml-banner--neutral"><span class="ml-banner__body">Offer declined.</span></div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Make another offer</a>
      </div>
      <div data-state="expired" style="margin-top:var(--space-3)" hidden>
        <div class="ml-banner ml-banner--warning"><span class="ml-banner__body">Offer expired after 48 hours.</span></div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=default">Make another offer</a>
      </div>

      <div data-state="default" data-state-default>
        <div class="ml-field" style="margin-top:var(--space-3)">
          <label for="o-amt">Your offer (₹)</label>
          <input id="o-amt" type="text" inputmode="numeric" value="24000" />
        </div>
        <div class="ml-field">
          <label for="o-note">Note to seller (optional)</label>
          <textarea id="o-note" rows="3" placeholder="Collection this weekend if that suits."></textarea>
        </div>
        <p class="ml-type-1" style="color:var(--color-muted)">Offers expire after 48 hours.</p>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-2)" href="?state=countered">Send offer</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
