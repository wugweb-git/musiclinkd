<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_search_filters/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Market — Search & filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/marketplace/marketplace_browse/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Search</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-field">
        <label for="q">Search the market</label>
        <input id="q" type="search" value="microphone" />
      </div>
      <div class="ml-chip-wrap" style="margin-top:var(--space-2)">
        <button type="button" class="ml-chip" aria-pressed="false">Under ₹5,000</button>
        <button type="button" class="ml-chip" aria-pressed="true">₹5,000–20,000</button>
        <button type="button" class="ml-chip" aria-pressed="false">Over ₹20,000</button>
        <button type="button" class="ml-chip" aria-pressed="true">Mumbai</button>
        <button type="button" class="ml-chip" aria-pressed="false">Delhi</button>
        <button type="button" class="ml-chip" aria-pressed="false">Bengaluru</button>
        <button type="button" class="ml-chip" aria-pressed="true">Like new</button>
        <button type="button" class="ml-chip" aria-pressed="false">Used</button>
      </div>

      <div data-state="default" style="margin-top:var(--space-3)" data-state-default>
        <a class="ml-result" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
          <img class="ml-result__thumb" src="/assets/img/speakers/0159435ccca405aa6d2c59bb4f11947b.jpg" alt="" loading="lazy" />
          <span class="ml-result__body">
            <span class="ml-result__name">Shure SM7B Microphone</span>
            <span class="ml-result__meta">Gear Sale · Mumbai</span>
          </span>
          <span class="ml-result__trail">₹28,500</span>
        </a>
        <a class="ml-result" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
          <img class="ml-result__thumb" src="/assets/img/speakers/5e4c5a1598e10dfe9c213609ce2ab5fb.jpg" alt="" loading="lazy" />
          <span class="ml-result__body">
            <span class="ml-result__name">Rode NT1 Condenser Mic</span>
            <span class="ml-result__meta">Gear Rental · Bengaluru</span>
          </span>
          <span class="ml-result__trail">₹450/day</span>
        </a>
      </div>

      <div class="ml-empty" data-state="empty" hidden>
        <h3 class="ml-empty__title">No matches</h3>
        <p class="ml-empty__body">Nothing matches those filters. Try removing one.</p>
        <a class="ml-btn ml-btn--secondary" href="?state=default">Clear filters</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
