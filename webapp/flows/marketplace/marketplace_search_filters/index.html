<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_search_filters/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Marketplace / Search &amp; Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .status-tag { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#3730A3; background:#E0E7FF; padding:3px 8px; border-radius:999px; flex:none; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
  .item-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-line); text-decoration: none; color: inherit; }
  .item-row img { width: 56px; height: 56px; border-radius: var(--radius-1); object-fit: cover; flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);height:56px;display:flex;align-items:center;gap:var(--space-2);">
      <a href="/preview/flows/marketplace/marketplace_browse/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;flex:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <input type="search" placeholder="Search listings…" value="studio monitors" style="flex:1;min-height:40px;border-radius:var(--radius-4);border:1px solid var(--color-line);padding:0 var(--space-3);font:var(--type-2) 'Inter',sans-serif;" />
      <!-- Proposed screen (spec: PRODUCT-SPEC.md Part B.2) — no Kotlin/webapp implementation exists yet. Real search/filter logic doesn't exist today; browse's category tabs are hardcoded. -->
      <span class="status-tag">Proposed</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4);">
      <div class="chip-wrap">
        <button type="button" class="ml-chip sel" style="background:var(--color-ink);border-color:var(--color-ink);color:#fff;">Studio Monitors</button>
        <button type="button" class="ml-chip">Microphones</button>
        <button type="button" class="ml-chip">Mixers</button>
        <button type="button" class="ml-chip">Preamps</button>
        <button type="button" class="ml-chip">Under ₹50,000</button>
        <button type="button" class="ml-chip">Like New</button>
      </div>

      <div id="panel-default">
        <a class="item-row" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="" />
          <div style="flex:1;"><b style="display:block;font-size:var(--type-2);">Yamaha HS8 Active Studio Monitors (Pair)</b><span style="font-size:var(--type-1);color:var(--color-muted);">₹42,000 · Like New</span></div>
        </a>
        <a class="item-row" href="/preview/flows/marketplace/marketplace_item_detail/index.html" style="border-bottom:none;">
          <img src="https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=200" alt="" />
          <div style="flex:1;"><b style="display:block;font-size:var(--type-2);">KRK Rokit 5 Monitors (pair)</b><span style="font-size:var(--type-1);color:var(--color-muted);">₹15,000 · Good</span></div>
        </a>
      </div>

      <div id="panel-empty" style="display:none;flex-direction:column;align-items:center;text-align:center;padding-top:15vh;gap:var(--space-3);">
        <p style="color:var(--color-muted);font-size:var(--type-2);">No listings match these filters.</p>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    document.addEventListener("musiclinkd:screen-ready", () => {
      if (window.MusicLinkd.currentState === "empty") {
        document.getElementById("panel-default").style.display = "none";
        document.getElementById("panel-empty").style.display = "flex";
      }
    });
  </script>
</body>
</html>
