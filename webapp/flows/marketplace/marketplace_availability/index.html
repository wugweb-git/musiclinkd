<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/marketplace/marketplace_availability/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Market — Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/marketplace/marketplace_item_detail/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0">Availability</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <a class="ml-result" href="/preview/flows/marketplace/marketplace_item_detail/index.html">
        <img class="ml-result__thumb" src="/assets/img/speakers/2ca39961ae931d2d4b515b2bc889e025.jpg" alt="" loading="lazy" />
        <span class="ml-result__body">
          <span class="ml-result__name">Focusrite Scarlett 2i2</span>
          <span class="ml-result__meta">Gear Rental · Mumbai</span>
        </span>
        <span class="ml-result__trail">₹800/day</span>
      </a>

      <div class="ml-calendar" data-state="default" style="margin-top:var(--space-3)" data-state-default>
        <div class="ml-calendar__head"><span class="ml-calendar__month">September 2026</span></div>
        <div class="ml-calendar__dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div class="ml-calendar__grid">
          <span></span>
          <button type="button" class="ml-calendar__day">1</button>
          <button type="button" class="ml-calendar__day">2</button>
          <button type="button" class="ml-calendar__day">3</button>
          <button type="button" class="ml-calendar__day">4</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="5 September, already rented">5</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="6 September, already rented">6</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="7 September, already rented">7</button>
          <button type="button" class="ml-calendar__day">8</button>
          <button type="button" class="ml-calendar__day">9</button>
          <button type="button" class="ml-calendar__day">10</button>
          <button type="button" class="ml-calendar__day">11</button>
          <button type="button" class="ml-calendar__day">12</button>
          <button type="button" class="ml-calendar__day">13</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="14 September, already rented">14</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="15 September, already rented">15</button>
          <button type="button" class="ml-calendar__day">16</button>
          <button type="button" class="ml-calendar__day">17</button>
          <button type="button" class="ml-calendar__day">18</button>
          <button type="button" class="ml-calendar__day">19</button>
          <button type="button" class="ml-calendar__day">20</button>
          <button type="button" class="ml-calendar__day">21</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="22 September, already rented">22</button>
          <button type="button" class="ml-calendar__day is-blocked" disabled aria-label="23 September, already rented">23</button>
          <button type="button" class="ml-calendar__day">24</button>
          <button type="button" class="ml-calendar__day">25</button>
          <button type="button" class="ml-calendar__day">26</button>
          <button type="button" class="ml-calendar__day">27</button>
          <button type="button" class="ml-calendar__day">28</button>
          <button type="button" class="ml-calendar__day">29</button>
          <button type="button" class="ml-calendar__day">30</button>
        </div>
        <div class="ml-calendar__legend">
          <span><i class="ml-calendar__key ml-calendar__key--sel"></i>Free</span>
          <span><i class="ml-calendar__key ml-calendar__key--blocked"></i>Already out</span>
        </div>
      </div>

      <div class="ml-empty" data-state="unavailable" hidden>
        <h2 class="ml-empty__title">This item isn't being rented right now</h2>
        <p class="ml-empty__body">The owner has paused it. You can still message them to ask.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/communication/chat_conversation/index.html">Message the owner</a>
      </div>
    </main>
    <footer class="ml-app__footer" data-state="default" data-state-default>
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/marketplace/marketplace_rental_summary/index.html">Request these dates</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
