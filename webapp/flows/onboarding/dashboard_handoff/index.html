<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/dashboard_handoff/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Onboarding / You're all set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .success-check { width: 72px; height: 72px; border-radius: 50%; background: var(--success); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto; animation: pop var(--duration-4) ease; }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); width: 100%; }
  .setup-tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-2); padding: var(--space-3); text-align: center; }
  .setup-tile .tile-icon { width: 40px; height: 40px; border-radius: var(--radius-2); background: var(--pink-container); color: var(--pink); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-2); font-size: var(--type-2); }
  .setup-tile span { font-size: var(--type-1); font-weight: 600; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar"></header>
    <main class="app-content app-content--scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);text-align:center;padding:0 var(--space-4);">
      <div>
        <div class="success-check">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h1 style="font-size:var(--type-4);margin-top:var(--space-4);">Welcome to MusicLink<em style="color:var(--pink);font-style:normal;">d</em></h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-2);">Your profile is live. Here's where to go from here:</p>
      </div>

      <div class="setup-grid">
        <div class="setup-tile">
          <div class="tile-icon">🎤</div>
          <span>Complete your portfolio</span>
        </div>
        <div class="setup-tile">
          <div class="tile-icon">🔍</div>
          <span>Explore talent & studios</span>
        </div>
        <div class="setup-tile">
          <div class="tile-icon">🤝</div>
          <span>Connect & collaborate</span>
        </div>
        <div class="setup-tile">
          <div class="tile-icon">🔐</div>
          <span>Get verified</span>
        </div>
      </div>

      <p style="font-size:var(--type-1);color:var(--muted);">Onboarding complete — 13 of 13 steps done.</p>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <a class="btn btn-p btn-block" href="/preview/flows/discover/discover_feed/index.html" style="text-decoration:none;">Explore MusicLinkd</a>
      <a class="btn btn-s btn-block" href="/preview/flows/profile_management/profile_overview/index.html" style="text-decoration:none;margin-top:var(--space-2);">View my profile</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
