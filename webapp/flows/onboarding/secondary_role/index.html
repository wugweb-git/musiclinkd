<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/secondary_role/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Secondary Role (optional)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/primary_role/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">2/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:15%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Add a secondary role?</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">Optional — helps others find you across disciplines.</p>
      </div>
      <div class="ml-banner ml-banner--info" data-state="skipped">Skipped — you can add a secondary role later in Profile settings.</div>
      <div role="radiogroup" aria-label="Secondary role" data-state="default">
        <button class="ml-choice" role="radio" aria-checked="true">
          <span class="ml-emoji" aria-hidden="true">🎼</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Composer</span>
            <span class="ml-choice__meta">Writing original music</span>
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🪘</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Percussionist</span>
            <span class="ml-choice__meta">Drums, tabla, dhol</span>
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🎛️</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Producer / Engineer</span>
            <span class="ml-choice__meta">Recording, mixing, mastering</span>
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🎧</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">DJ</span>
            <span class="ml-choice__meta">Live sets, events, clubs</span>
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--ghost ml-btn--block" href="/preview/flows/onboarding/genres/index.html" style="margin-bottom:var(--space-2)">Skip for now</a><a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/genres/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
