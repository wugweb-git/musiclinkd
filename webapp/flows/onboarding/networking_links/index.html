<head>

<title>MusicLinkd — Networking Links (Spotify/YouTube/SoundCloud/LinkedIn)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />

<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/profile_creation/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">9/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:69%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-4" style="margin:0">Add your links</h1>
        <p class="ml-type-3" style="color:var(--color-muted);margin:var(--space-1) 0 0">Optional — share your music and socials so collaborators can hear your work.</p>
      </div>
      <div class="ml-field"><label for="spotify">Spotify</label><input id="spotify" type="url" inputmode="url" placeholder="open.spotify.com/artist/…" /></div>
      <div class="ml-field"><label for="youtube">YouTube</label><input id="youtube" type="url" inputmode="url" placeholder="youtube.com/@yourchannel" /></div>
      <div class="ml-field"><label for="soundcloud">SoundCloud</label><input id="soundcloud" type="url" inputmode="url" placeholder="soundcloud.com/you" /></div>
      <div class="ml-field"><label for="linkedin">LinkedIn</label><input id="linkedin" type="url" inputmode="url" placeholder="linkedin.com/in/you" /></div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--ghost ml-btn--block" href="/preview/flows/onboarding/persona_badges/index.html" style="margin-bottom:var(--space-2)">Skip for now</a><a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/persona_badges/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
