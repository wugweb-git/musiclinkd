<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/instruments/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/languages/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">5/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:38%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Which instruments do you play?</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">Select all that apply. Skilled musicians can be discovered for more work.</p>
      </div>
      <div class="ml-banner ml-banner--info" data-state="skipped_for_non_musician">Skipped — instruments and proficiency won't appear on your profile.</div>
      <div data-state="default">
        <button class="ml-choice" role="radio" aria-checked="true">
          <span class="ml-emoji" aria-hidden="true">🎸</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Acoustic Guitar</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">⚡</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Electric Guitar</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="true">
          <span class="ml-emoji" aria-hidden="true">🎸</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Bass Guitar</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🎹</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Keyboard / Synthesizer</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🎹</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Piano</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true">🥁</span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Drums</span>
            
          </span>
          <span class="ml-choice__mark"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        </button>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--ghost ml-btn--block" href="/preview/flows/onboarding/location/index.html" style="margin-bottom:var(--space-2)">Not a musician — skip instruments</a><a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/instrument_proficiency/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
