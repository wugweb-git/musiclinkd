<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/instrument_proficiency/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Instrument Proficiency (per-instrument years/level)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/instruments/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">6/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:46%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Tell us your skill level</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">For each instrument, roughly how many years and your experience level.</p>
      </div>

      <div class="ml-card ml-card--padded">
        <div class="ml-row" style="padding-top:0">
          <span class="ml-emoji" aria-hidden="true">🎸</span>
          <span class="ml-row__body"><span class="ml-row__title">Acoustic Guitar</span></span>
        </div>
        <div class="ml-segmented" role="tablist" style="margin-bottom:var(--space-3)">
          <button class="ml-segmented__btn" role="tab" aria-selected="false">Beginner</button>
          <button class="ml-segmented__btn" role="tab" aria-selected="true">Intermediate</button>
          <button class="ml-segmented__btn" role="tab" aria-selected="false">Pro</button>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3)">
          <button class="ml-icon-btn" aria-label="Fewer years">−</button>
          <span class="ml-type-3" style="flex:1;text-align:center">6 yrs</span>
          <button class="ml-icon-btn" aria-label="More years">+</button>
        </div>
      </div>

      <div class="ml-card ml-card--padded">
        <div class="ml-row" style="padding-top:0">
          <span class="ml-emoji" aria-hidden="true">🎸</span>
          <span class="ml-row__body"><span class="ml-row__title">Bass Guitar</span></span>
        </div>
        <div class="ml-segmented" role="tablist" style="margin-bottom:var(--space-3)">
          <button class="ml-segmented__btn" role="tab" aria-selected="true">Beginner</button>
          <button class="ml-segmented__btn" role="tab" aria-selected="false">Intermediate</button>
          <button class="ml-segmented__btn" role="tab" aria-selected="false">Pro</button>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3)">
          <button class="ml-icon-btn" aria-label="Fewer years">−</button>
          <span class="ml-type-3" style="flex:1;text-align:center">2 yrs</span>
          <button class="ml-icon-btn" aria-label="More years">+</button>
        </div>
      </div>

      <p class="ml-type-1" style="color:var(--color-muted)">You can always update this later in Profile settings.</p>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/location/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
