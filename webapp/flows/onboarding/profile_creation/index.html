<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/profile_creation/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Profile Creation (name/bio/photo/cover)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/location/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">8/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:62%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Build your profile</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">A complete profile gets discovered and booked more often.</p>
      </div>

      <div style="display:flex;align-items:center;gap:var(--space-3)">
        <span class="ml-avatar ml-avatar--lg" aria-hidden="true"></span>
        <button class="ml-btn ml-btn--secondary">Add photo</button>
      </div>
      <button class="ml-upload-grid__add" style="aspect-ratio:16/9">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add cover photo
      </button>
      <p class="ml-type-1" style="color:var(--color-muted)">Real photos only — no placeholder avatars.</p>

      <div class="ml-field">
        <label for="name">Display name</label>
        <input id="name" type="text" placeholder="Arijit Sen" autocomplete="name" />
      </div>
      <div class="ml-field">
        <label for="bio">Bio</label>
        <textarea id="bio" placeholder="Playback vocalist based in Mumbai. 6 years of session work across Hindi and Punjabi film music."></textarea>
        <span class="ml-type-1" style="color:var(--color-muted)">Up to 300 characters.</span>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/networking_links/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
