<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/profile_creation/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Onboarding / Profile creation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .onb-step { font-size: var(--type-1); color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .onb-progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .onb-progress > span { display: block; height: 100%; background: var(--pink); border-radius: 2px; }

  .photo-row { display: flex; align-items: center; gap: var(--space-3); }
  .avatar-upload {
    width: 96px; height: 96px; border-radius: 50%; border: 1px dashed var(--line); background: var(--surface-alt);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1);
    color: var(--muted); cursor: pointer; flex-shrink: 0;
  }
  .cover-upload {
    flex: 1; height: 64px; border-radius: var(--radius-2); border: 1px dashed var(--line); background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; gap: var(--space-2); color: var(--muted);
    cursor: pointer; font-size: var(--type-1); font-weight: 600;
  }
  .field textarea {
    min-height: 96px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2); border: 1px solid var(--line);
    background: #fff; color: var(--black); font: var(--type-2) 'Inter', sans-serif; outline: none; resize: none;
  }
  .field textarea:focus { border-color: var(--pink); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/onboarding/location/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="onb-step" style="margin-left:var(--space-2);">Step 8 of 13</div>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="onb-progress"><span style="width:62%"></span></div>
      <div>
        <h1 style="font-size:var(--type-3);">Build your profile</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">A complete profile gets discovered and booked more often.</p>
      </div>

      <div class="photo-row">
        <div class="avatar-upload" role="button" tabindex="0" aria-label="Add profile photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span style="font-size:var(--type-1);font-weight:600;">Photo</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:var(--space-2);">
          <div class="cover-upload" role="button" tabindex="0" aria-label="Add cover photo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Add cover photo
          </div>
          <p style="font-size:var(--type-1);color:var(--muted);">Real photos only — no placeholder avatars.</p>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:var(--space-3);">
        <div class="field">
          <label for="name">Display name</label>
          <input id="name" type="text" placeholder="Your name or stage name" autocomplete="name" />
        </div>
        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" placeholder="Tell others about your sound, experience, and what you're looking for."></textarea>
        </div>
      </div>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <a class="btn btn-p btn-block" href="/preview/flows/onboarding/networking_links/index.html" style="text-decoration:none;">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
