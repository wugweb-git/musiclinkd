<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/submit_publish/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Submit / Publish Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/review_confirm/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">12/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:92%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);text-align:center">
      <div data-state="submitting">
        <div class="ml-spinner" style="margin:0 auto"></div>
        <h1 class="ml-type-3" style="margin:var(--space-3) 0 0">Creating your profile…</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">This takes a few seconds.</p>
      </div>

      <div data-state="success">
        <div class="ml-check">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
        <h1 class="ml-type-3" style="margin:var(--space-3) 0 0">Profile published</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">You're now discoverable on MusicLinkd.</p>
        <span class="ml-status ml-status--success" style="margin-top:var(--space-3)">Verified email</span>
      </div>

      <div data-state="error">
        <h1 class="ml-type-3" style="margin:0">Something went wrong</h1>
        <div class="ml-banner ml-banner--error" role="alert" style="margin-top:var(--space-3)">
          We couldn't publish your profile right now. Check your connection and try again.
        </div>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/dashboard_handoff/index.html" data-state="success">Continue</a>
      <span class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" aria-disabled="true" data-state="submitting">Publishing…</span>
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="?state=submitting" data-state="error">Try again</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
