<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/persona_badges/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Onboarding / Persona badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .onb-step { font-size: var(--type-1); color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .onb-progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .onb-progress > span { display: block; height: 100%; background: var(--pink); border-radius: 2px; }
  .badge-pick {
    display: inline-flex; align-items: center; gap: var(--space-1);
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-4);
    border: 1px solid var(--line); background: #fff; color: var(--black);
    font: 500 var(--type-2) 'Inter', sans-serif; cursor: pointer;
    transition: all var(--duration-1) ease; user-select: none;
  }
  .badge-pick:hover { background: var(--surface-alt); }
  .badge-pick.selected { border-color: var(--pink); background: var(--pink-container); color: var(--pink); font-weight: 600; }
  .badge-pick .check { opacity: 0; width: 0; overflow: hidden; transition: opacity var(--duration-1) ease, width var(--duration-1) ease; }
  .badge-pick.selected .check { opacity: 1; width: 14px; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/onboarding/networking_links/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="onb-step" style="margin-left:var(--space-2);">Step 10 of 13</div>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="onb-progress"><span style="width:77%"></span></div>
      <div>
        <h1 style="font-size:var(--type-3);">How should you be discovered?</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">Pick a few badges that describe how you work.</p>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);" role="group" aria-label="Persona badges">
        <button class="badge-pick selected" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Available for Collab</button>
        <button class="badge-pick selected" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Touring</button>
        <button class="badge-pick" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Open to Session Work</button>
        <button class="badge-pick" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Teaches</button>
        <button class="badge-pick" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Recording</button>
        <button class="badge-pick" type="button"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>Remixing / Production</button>
      </div>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <a class="btn btn-p btn-block" href="/preview/flows/onboarding/review_confirm/index.html" style="text-decoration:none;">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // Presentation-only multi-select.
    document.querySelectorAll(".badge-pick").forEach((b) => {
      b.addEventListener("click", () => b.classList.toggle("selected"));
    });
  </script>
</body>
</html>
