<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/primary_role/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — User Onboarding / Choose your role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  /* Onboarding shared components — token-driven, matches styleguide's
     scr-onboard patterns (step eyebrow, 3px progress bar, .card-s rows). */
  .onb-step { font-size: var(--type-1); color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
  .onb-progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .onb-progress > span { display: block; height: 100%; background: var(--pink); border-radius: 2px; }

  .card-s {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius-2);
    padding: var(--space-2) var(--space-3); display: flex; align-items: center; gap: var(--space-3);
    cursor: pointer; width: 100%; text-align: left; font-family: inherit;
    transition: border-color var(--duration-1) ease, background var(--duration-1) ease;
  }
  .card-s:hover { background: var(--surface-alt); }
  .card-s.selected { border: 2px solid var(--pink); padding: calc(var(--space-2) - 1px) calc(var(--space-3) - 1px); background: var(--pink-container); }
  .card-s .icon-circle {
    width: 40px; height: 40px; border-radius: 50%; background: var(--pink-container); color: var(--pink);
    display: flex; align-items: center; justify-content: center; font-size: var(--type-2); font-weight: 700;
    flex-shrink: 0;
  }
  .card-s.selected .icon-circle { background: #fff; }
  .card-s .radio-dot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-left: auto; flex-shrink: 0;
  }
  .card-s.selected .radio-dot { border-color: var(--pink); background: var(--pink); box-shadow: inset 0 0 0 4px #fff; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-3);padding-right:var(--space-3);display:flex;align-items:center;height:56px;">
      <a href="/preview/flows/auth/registration_write/index.html" aria-label="Back" style="display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;color:var(--black);text-decoration:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="onb-step" style="margin-left:var(--space-2);">Step 1 of 13</div>
    </header>
    <main class="app-content app-content--scroll" style="padding:0 var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);">
      <div class="onb-progress"><span style="width:8%"></span></div>
      <div>
        <h1 style="font-size:var(--type-3);">What's your primary role?</h1>
        <p style="color:var(--muted);font-size:var(--type-2);margin-top:var(--space-1);">This is how you'll show up on MusicLinkd. You can add a secondary role next.</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:var(--space-2);">
        <button class="card-s selected" type="button">
          <div class="icon-circle">🎤</div>
          <div>
            <div style="font-weight:600;">Singer / Vocalist</div>
            <div style="font-size:var(--type-1);color:var(--muted);">Lead or backing vocals</div>
          </div>
          <div class="radio-dot"></div>
        </button>
        <button class="card-s" type="button">
          <div class="icon-circle">🎙️</div>
          <div>
            <div style="font-weight:600;">Rapper / MC</div>
            <div style="font-size:var(--type-1);color:var(--muted);">Hip-hop, rap, spoken word</div>
          </div>
          <div class="radio-dot"></div>
        </button>
        <button class="card-s" type="button">
          <div class="icon-circle">🧑‍🎤</div>
          <div>
            <div style="font-weight:600;">Folk Vocalist</div>
            <div style="font-size:var(--type-1);color:var(--muted);">Traditional & folk performance</div>
          </div>
          <div class="radio-dot"></div>
        </button>
        <button class="card-s" type="button">
          <div class="icon-circle">🎸</div>
          <div>
            <div style="font-weight:600;">Guitarist</div>
            <div style="font-size:var(--type-1);color:var(--muted);">Acoustic, electric, bass</div>
          </div>
          <div class="radio-dot"></div>
        </button>
        <button class="card-s" type="button">
          <div class="icon-circle">🎹</div>
          <div>
            <div style="font-weight:600;">Keyboardist / Pianist</div>
            <div style="font-size:var(--type-1);color:var(--muted);">Keys, piano, synthesis</div>
          </div>
          <div class="radio-dot"></div>
        </button>
      </div>

      <p style="font-size:var(--type-1);color:var(--muted);text-align:center;">Your role is sourced from the platform taxonomy and shown on your public profile.</p>
    </main>
    <footer class="app-bottombar" style="padding:0 var(--space-4) var(--space-3);">
      <a class="btn btn-p btn-block" href="/preview/flows/onboarding/secondary_role/index.html" style="text-decoration:none;">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // Presentation-only single-select — no real persistence (see screen.json).
    document.querySelectorAll(".card-s").forEach((card) => {
      card.addEventListener("click", () => {
        document.querySelectorAll(".card-s").forEach((c) => c.classList.remove("selected"));
        card.classList.add("selected");
      });
    });
  </script>
</body>
</html>
