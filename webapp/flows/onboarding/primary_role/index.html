<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/primary_role/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Primary Role Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/guide/system/ml-fixes.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/auth/registration_write/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">1/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:8%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">What's your primary role?</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">This is how you'll show up on MusicLinkd. You can add a secondary role next.</p>
      </div>
      <div role="radiogroup" aria-label="Primary role">
        <button class="ml-choice" role="radio" aria-checked="true">
          <span class="ml-emoji" aria-hidden="true"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-mic"/></svg></span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Singer / Vocalist</span>
            <span class="ml-choice__meta">Lead or backing vocals</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-mic"/></svg></span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Rapper / MC</span>
            <span class="ml-choice__meta">Hip-hop, rap, spoken word</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-vocalist"/></svg></span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Folk Vocalist</span>
            <span class="ml-choice__meta">Traditional &amp; folk performance</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-guitar"/></svg></span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Guitarist</span>
            <span class="ml-choice__meta">Acoustic, electric, bass</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
        <button class="ml-choice" role="radio" aria-checked="false">
          <span class="ml-emoji" aria-hidden="true"><svg class="ml-icon ml-icon--2" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-piano"/></svg></span>
          <span class="ml-choice__body">
            <span class="ml-choice__title">Keyboardist / Pianist</span>
            <span class="ml-choice__meta">Keys, piano, synthesis</span>
          </span>
          <span class="ml-choice__mark"><svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-check-light"/></svg></span>
        </button>
      </div>
      <p class="ml-type-1" style="color:var(--color-muted)">Your role is sourced from the platform's 18 person types.</p>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/secondary_role/index.html">Continue</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
