<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/onboarding/review_confirm/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Review / Confirm Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-navbar"><a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/onboarding/persona_badges/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a><span class="ml-navbar__spacer"></span><div class="ml-steps">
        <span class="ml-steps__label">11/13</span>
        <span class="ml-steps__track"><span class="ml-steps__fill" style="width:85%"></span></span>
      </div></header>
    <main class="ml-app__body" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div>
        <h1 class="ml-type-3" style="margin:0">Review your profile</h1>
        <p class="ml-type-2" style="color:var(--color-muted);margin:var(--space-1) 0 0">Make sure everything looks right before you publish.</p>
      </div>

      <div>
        <section class="ml-section-block"><div class="ml-section"><h2>Profile</h2><a class="ml-section__link" href="/preview/flows/onboarding/profile_creation/index.html">Edit</a></div>
        <div class="ml-card ml-card--padded">
          <div class="ml-row">
          <span class="ml-row__body">
            <span class="ml-row__meta">Name</span>
            <span class="ml-row__title">Arijit Sen</span>
          </span>
        </div>
          <div class="ml-row">
          <span class="ml-row__body">
            <span class="ml-row__meta">Based in</span>
            <span class="ml-row__title">Mumbai, MH · Andheri West</span>
          </span>
        </div>
        </div></section>
      </div>

      <div>
        <section class="ml-section-block"><div class="ml-section"><h2>Role</h2><a class="ml-section__link" href="/preview/flows/onboarding/primary_role/index.html">Edit</a></div>
        <div class="ml-card ml-card--padded">
          <div class="ml-row">
          <span class="ml-row__body">
            <span class="ml-row__meta">Primary</span>
            <span class="ml-row__title">Singer / Vocalist</span>
          </span>
        </div>
          <div class="ml-row">
          <span class="ml-row__body">
            <span class="ml-row__meta">Secondary</span>
            <span class="ml-row__title">Composer</span>
          </span>
        </div>
        </div></section>
      </div>

      <div>
        <section class="ml-section-block"><div class="ml-section"><h2>Skills</h2><a class="ml-section__link" href="/preview/flows/onboarding/genres/index.html">Edit</a></div>
        <div class="ml-card ml-card--padded" style="display:flex;flex-direction:column;gap:var(--space-3)">
          <div><div class="ml-row__meta">Genres</div><div class="ml-chip-wrap" style="margin-top:var(--space-2)"><button class="ml-chip" aria-pressed="true">Bollywood / Filmi</button><button class="ml-chip" aria-pressed="true">Sufi Devotional</button></div></div>
          <div><div class="ml-row__meta">Languages</div><div class="ml-chip-wrap" style="margin-top:var(--space-2)"><button class="ml-chip" aria-pressed="true">Hindi</button><button class="ml-chip" aria-pressed="true">English</button></div></div>
          <div><div class="ml-row__meta">Instruments</div><div class="ml-chip-wrap" style="margin-top:var(--space-2)"><button class="ml-chip" aria-pressed="true">Acoustic Guitar · 6 yrs</button><button class="ml-chip" aria-pressed="true">Bass Guitar · 2 yrs</button></div></div>
        </div></section>
      </div>

      <div>
        <section class="ml-section-block"><div class="ml-section"><h2>Badges</h2><a class="ml-section__link" href="/preview/flows/onboarding/persona_badges/index.html">Edit</a></div>
        <div class="ml-chip-wrap"><button class="ml-chip" aria-pressed="true">Available for Collab</button><button class="ml-chip" aria-pressed="true">Open to Session Work</button><button class="ml-chip" aria-pressed="true">Recording</button></div></section>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block ml-btn--lg" href="/preview/flows/onboarding/submit_publish/index.html">Looks good — publish</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
