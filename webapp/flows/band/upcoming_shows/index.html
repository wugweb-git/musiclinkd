<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/band/upcoming_shows/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Band — Shows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/band/band_profile_layout/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0">Shows</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <!-- The declared state is "hardcoded", which is a note in the registry
           that the Android screen ships a fixed list rather than reading
           Firestore. It is not a state this screen enters, so it is recorded
           here rather than rendered as one. -->
      <div data-state="hardcoded">
      <div class="ml-section"><h2>Upcoming</h2></div>
      <div class="ml-booking-card">
        <div class="ml-booking-card__body">
          <span class="ml-booking-card__title">Antisocial, Khar</span>
          <span class="ml-booking-card__meta">18 Aug 2026 · Doors 8pm · ₹500</span>
          <span class="ml-status ml-status--success">Confirmed</span>
        </div>
      </div>
      <div class="ml-booking-card">
        <div class="ml-booking-card__body">
          <span class="ml-booking-card__title">The Quarter, Lower Parel</span>
          <span class="ml-booking-card__meta">02 Sep 2026 · Doors 9pm · ₹700</span>
          <span class="ml-status ml-status--success">Confirmed</span>
        </div>
      </div>
      <div class="ml-booking-card">
        <div class="ml-booking-card__body">
          <span class="ml-booking-card__title">Bandra Base</span>
          <span class="ml-booking-card__meta">21 Sep 2026 · Support slot · ₹400</span>
          <span class="ml-status ml-status--warning">Holding</span>
        </div>
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h2>Past</h2></div>
      <div class="ml-summary__row"><span>12 Jul 2026 · Antisocial, Khar</span><span>Sold out</span></div>
      <div class="ml-summary__row"><span>28 Jun 2026 · The Quarter</span><span>180 in</span></div>
      </div>
    </main>
    <footer class="ml-app__footer">
      <a class="ml-btn ml-btn--primary ml-btn--block" href="/preview/flows/band/band_profile_layout/index.html">Add a show</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
