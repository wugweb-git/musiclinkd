<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/qr_share/qr_share_flow/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Share profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/profile_management/profile_overview/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0">Share</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div data-state="home">
        <div class="ml-empty" style="padding-block:var(--space-3)">
          <div class="ml-qr" aria-label="QR code for Ishita Rao's profile"></div>
          <h2 class="ml-empty__title">Ishita Rao</h2>
          <p class="ml-empty__body">musiclinkd.com/ishitarao</p>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" href="?state=options">Share or export</a>
      </div>

      <div data-state="options">
        <div class="ml-section"><h2>Share</h2></div>
        <a class="ml-action-row" href="?state=home">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Copy link</span>
          <span class="ml-choice__meta">musiclinkd.com/ishitarao</span>
        </span>
        <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
      </a>
        <a class="ml-action-row" href="/preview/flows/communication/chat_thread_list/index.html">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Send in a message</span>
          
        </span>
        <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
      </a>
        <div class="ml-section" style="margin-top:var(--space-3)"><h2>Export</h2></div>
        <a class="ml-action-row" href="?state=preview">
        <span class="ml-choice__body">
          <span class="ml-choice__title">Comp card</span>
          <span class="ml-choice__meta">A one-page PDF with your photo, roles and rates</span>
        </span>
        <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
      </a>
        <a class="ml-action-row" href="?state=preview">
        <span class="ml-choice__body">
          <span class="ml-choice__title">QR poster</span>
          <span class="ml-choice__meta">A3, for a green room wall</span>
        </span>
        <svg width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6.65.66c-.87.88-.87 2.3 0 3.18L14.71 12l-8.06 8.16c-.87.88-.87 2.3 0 3.18a2.2 2.2 0 0 0 3.14 0L21 12 9.8.66a2.2 2.2 0 0 0-3.15 0"/></svg>
      </a>
      </div>

      <div data-state="preview">
        <div class="ml-section"><h2>Comp card</h2></div>
        <img src="/assets/img/editorials/291c9c89af5a84fd95b6be0fc51380a8.jpg" alt="Comp card preview" loading="lazy"
             style="width:100%;aspect-ratio:var(--media-aspect-card);object-fit:cover;border-radius:var(--radius-2)" />
        <div class="ml-summary" style="margin-top:var(--space-2)">
          <div class="ml-summary__row"><span>Includes</span><span>Photo, roles, rates, QR</span></div>
          <div class="ml-summary__row"><span>Format</span><span>PDF · A5</span></div>
        </div>
        <a class="ml-btn ml-btn--primary ml-btn--block" style="margin-top:var(--space-3)" href="?state=home">Download</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
