<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/communication/connection_requests_tab/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Communication / Connection Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .net-tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--color-line); }
  .net-tabs a { flex: 1; text-align: center; padding: var(--space-2) 0; font-size: var(--type-1); font-weight: 600; color: var(--color-muted); text-decoration: none; border-bottom: 2px solid transparent; }
  .net-tabs a.active { color: var(--color-ink); border-color: var(--color-ink); }
  .req-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-line); }
  .req-row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; }
  .req-row .meta { flex: 1; min-width: 0; }
  .req-row .meta b { font-size: var(--type-2); }
  .req-row .meta span { display: block; font-size: var(--type-1); color: var(--color-muted); }
  .req-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; }
  .icon-btn.accept { background: var(--color-ink); color: #fff; }
  .icon-btn.decline { background: var(--color-surface); color: var(--color-muted); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">Network</h1>
    </header>
    <nav class="net-tabs">
      <a href="/preview/flows/communication/connection_requests_tab/index.html" class="active">Requests</a>
      <a href="/preview/flows/communication/collaborators_tab/index.html">Collaborators</a>
      <a href="/preview/flows/communication/ai_matchmaker_tab/index.html">AI Match</a>
    </nav>
    <main class="app-content app-content--scroll" style="padding:var(--space-2) var(--space-4) var(--space-4);">
      <div class="req-row">
        <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=200" alt="" />
        <div class="meta"><b>Kabir Sethi</b><span>Indie singer-songwriter · wants to connect</span></div>
        <div class="req-actions">
          <button type="button" class="icon-btn accept" aria-label="Accept"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>
          <button type="button" class="icon-btn decline" aria-label="Decline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
      <div class="req-row" style="border-bottom:none;">
        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" alt="" />
        <div class="meta"><b>Aanya Malhotra</b><span>Alternative vocalist · wants to connect</span></div>
        <div class="req-actions">
          <button type="button" class="icon-btn accept" aria-label="Accept"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>
          <button type="button" class="icon-btn decline" aria-label="Decline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
