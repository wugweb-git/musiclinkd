<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/communication/ai_matchmaker_tab/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Communication / AI Matchmaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
.net-tabs a { flex: 1; text-align: center; padding: var(--space-2) 0; font-size: var(--type-1); font-weight: 600; color: var(--color-muted); text-decoration: none; border-bottom: 2px solid transparent; }
.match-card { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--color-line); border-radius: var(--radius-2); margin-bottom: var(--space-2); }
  .match-card img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; }
  .match-pct { font-weight: 700; color: var(--color-pink); font-size: var(--type-2); flex: none; }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar" style="padding-left:var(--space-4);padding-right:var(--space-3);height:56px;display:flex;align-items:center;">
      <h1 style="font-size:var(--type-3);">Network</h1>
      <!-- Tab exists in the underlying code but is missing from the visible tab list today — not reachable through the real app's UI, not just hidden by a flag. -->
      <span class="ml-status ml-status--warning" style="margin-left:auto">Unreachable in app</span>
    </header>
    <nav class="ml-tabs ml-tabs--fill" role="tablist">
      <a class="ml-tabs__tab" role="tab" href="/preview/flows/communication/connection_requests_tab/index.html" aria-selected="false">Requests</a>
      <a class="ml-tabs__tab" role="tab" href="/preview/flows/communication/collaborators_tab/index.html" aria-selected="false">Collaborators</a>
      <a tabindex="0" aria-current="page" class="ml-tabs__tab" role="tab" aria-selected="true">AI Match</a>
    </nav>
    <main class="app-content app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4);">
      <p style="color:var(--color-muted);font-size:var(--type-2);margin-top:0;margin-bottom:var(--space-3);">Matched on genre, location, and complementary roles.</p>

      <div class="match-card">
        <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=200" alt="" />
        <div style="flex:1;"><b style="font-size:var(--type-2);display:block;">Aarav Mehta</b><span style="font-size:var(--type-1);color:var(--color-muted);">Synth Producer · Mumbai</span></div>
        <div class="match-pct">92%</div>
      </div>
      <div class="match-card">
        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" alt="" />
        <div style="flex:1;"><b style="font-size:var(--type-2);display:block;">Vikramaditya Roy</b><span style="font-size:var(--type-1);color:var(--color-muted);">Sitar · New Delhi</span></div>
        <div class="match-pct">87%</div>
      </div>
      <div class="match-card">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200" alt="" />
        <div style="flex:1;"><b style="font-size:var(--type-2);display:block;">Rohan Deshmukh</b><span style="font-size:var(--type-1);color:var(--color-muted);">Acoustic Producer · Pune</span></div>
        <div class="match-pct">81%</div>
      </div>
    </main>
    <footer class="app-bottombar"></footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
