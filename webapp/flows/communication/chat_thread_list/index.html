<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/communication/chat_thread_list/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;padding:var(--space-3) var(--space-4)">
      <h1 class="ml-type-3" style="margin:0">Messages</h1>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <a class="ml-notification ml-notification--unread" data-state="default" href="/preview/flows/communication/chat_conversation/index.html">
        <div class="ml-person-row" style="border:0;padding:0">
          <img src="/assets/img/editorials/291c9c89af5a84fd95b6be0fc51380a8.jpg" alt="" loading="lazy" />
          <span class="meta"><b>Ishita Rao</b><p>Sounds good — Tuesday works.</p></span>
          <span class="time">4h</span>
        </div>
      </a>
      <a class="ml-notification" data-state="default" href="/preview/flows/communication/chat_conversation/index.html">
        <div class="ml-person-row" style="border:0;padding:0">
          <img src="/assets/img/editorials/41f63164364f0757ddb2a20693f4b144.jpg" alt="" loading="lazy" />
          <span class="meta"><b>Blue Note Recording Co.</b><p>Room B is yours from 6.</p></span>
          <span class="time">Yesterday</span>
        </div>
      </a>
      <a class="ml-notification" data-state="default" href="/preview/flows/communication/chat_conversation/index.html">
        <div class="ml-person-row" style="border:0;padding:0">
          <img src="/assets/img/editorials/57aaa337f11143d89be62ba33e20211d.jpg" alt="" loading="lazy" />
          <span class="meta"><b>Kabir Sheth</b><p>Sent the charts over.</p></span>
          <span class="time">2d</span>
        </div>
      </a>

      <div class="ml-empty" data-state="empty">
        <h3 class="ml-empty__title">No messages yet</h3>
        <p class="ml-empty__body">Message someone from their profile, or accept a connection request to start a thread.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/communication/collaborators_tab/index.html">See collaborators</a>
      </div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
