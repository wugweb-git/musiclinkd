<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/communication/chat_conversation/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Communication / Chat Conversation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  .chat-header { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); height: 56px; }
  .chat-header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .bubble-row { display: flex; margin-bottom: var(--space-2); }
  .bubble-row.mine { justify-content: flex-end; }
  .bubble { max-width: 75%; padding: var(--space-2) var(--space-3); border-radius: 16px; font-size: var(--type-2); }
  .bubble-row:not(.mine) .bubble { background: var(--color-surface); color: var(--color-ink); border-bottom-left-radius: 4px; }
  .bubble-row.mine .bubble { background: var(--color-ink); color: #fff; border-bottom-right-radius: 4px; }
  .composer { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); }
  .composer input { flex: 1; min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-4); border: 1px solid var(--color-line); font: var(--type-2) 'Inter', sans-serif; }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--color-ink); color: #fff; border: none; display: flex; align-items: center; justify-content: center; flex: none; }
  .sending-text, .error-text { text-align: center; font-size: var(--type-1); margin-bottom: var(--space-2); }
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar chat-header">
      <a href="/preview/flows/communication/chat_thread_list/index.html" aria-label="Back" style="display:flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:50%;color:var(--color-ink);text-decoration:none;margin-right:-6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="" />
      <span style="font-size:var(--type-2);font-weight:600;">Vedanshu Beats</span>
    </header>
    <main class="app-content app-content--scroll" style="padding:var(--space-3);">
      <div class="bubble-row"><div class="bubble">Hey! Just heard the rough cut, sounds great 🔥</div></div>
      <div class="bubble-row mine"><div class="bubble">Thank you! Want to send over the stems tonight?</div></div>
      <div class="bubble-row"><div class="bubble">Sent you the mix — check the second verse</div></div>
      <p class="sending-text" id="sending-text" style="display:none;color:var(--color-muted);">Sending…</p>
      <p class="error-text" id="error-text" style="display:none;color:var(--color-error);">Message failed to send. <a href="#" class="ml-link">Retry</a></p>
    </main>
    <footer class="app-bottombar composer">
      <input type="text" placeholder="Message…" id="msg-input" aria-label="Write a message" />
      <button type="button" class="send-btn" id="send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
  <script>
    // states: default | sending | error — see screen.json
    document.addEventListener("musiclinkd:screen-ready", () => {
      const state = window.MusicLinkd.currentState;
      if (state === "sending") document.getElementById("sending-text").style.display = "block";
      if (state === "error") document.getElementById("error-text").style.display = "block";
    });
  </script>
</body>
</html>
