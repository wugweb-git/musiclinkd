<title>MusicLinkd — Saved — Item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <div class="ml-app">
    <header class="ml-appbar">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/saved_favorites/saved_favorites_hub/index.html" aria-label="Back">
          <svg class="ml-icon ml-icon--1" aria-hidden="true"><use href="/guide/system/ml-icons.svg#i-chevron-left"/></svg>
        </a>
      <h1 class="ml-type-4" style="margin:0;flex:1">Saved item</h1>
      
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <a class="ml-result" data-state="default" href="/preview/flows/booking/studio_profile/index.html" data-state-default>
        <img class="ml-result__thumb" src="/assets/img/6/01e26955706919.598fd42d42f34.png" alt="" loading="lazy" />
        <span class="ml-result__body">
          <span class="ml-result__name">Yash Raj Sound Studios</span>
          <span class="ml-result__meta">Andheri West · from ₹1,800/hr</span>
        </span>
      </a>

      <div class="ml-summary" style="margin-top:var(--space-3)" data-state="default" data-state-default>
        <div class="ml-summary__row"><span>Saved</span><span>1 week ago</span></div>
        <div class="ml-summary__row"><span>Favourite</span><span>Yes</span></div>
        <div class="ml-summary__row"><span>Collection</span><span>Mumbai studios</span></div>
        <div class="ml-summary__row"><span>Type</span><span>Studio</span></div>
      </div>

      <div class="ml-empty" data-state="unavailable" hidden>
        <h2 class="ml-empty__title">This item is no longer available</h2>
        <p class="ml-empty__body">It may have been sold, closed, made private or removed. You can take it out of your saved list.</p>
        <a class="ml-btn ml-btn--primary" href="/preview/flows/saved_favorites/saved_favorites_hub/index.html">Remove from saved</a>
      </div>
    </main>
    <footer class="ml-app__footer" data-state="default" style="display:flex;gap:var(--space-2)" data-state-default>
      <button class="ml-btn ml-btn--secondary" type="button" style="flex:1">Remove</button>
      <a class="ml-btn ml-btn--primary" style="flex:1" href="/preview/flows/booking/studio_profile/index.html">Open original</a>
    </footer>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
