<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="screen-json-path" content="/preview/flows/reviews/rating_breakdown/screen.json" />
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Reviews — Breakdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/guide/system/ml-tokens.css" />
<link rel="stylesheet" href="/guide/system/ml-core.css" />
<link rel="stylesheet" href="/guide/system/ml-widgets.css" />
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
</head>
<body>

  <div class="ml-app">
    <header class="ml-appbar" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3)">
      <a class="ml-icon-btn ml-icon-btn--bare" href="/preview/flows/reviews/review_list/index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      <h1 class="ml-type-2" style="margin:0;flex:1">Rating breakdown</h1>
      <span class="ml-status ml-status--accent" title="This flow is a design preview">Beta</span>
    </header>
    <main class="ml-app__body app-content--scroll" style="padding:var(--space-3) var(--space-4) var(--space-4)">
      <div class="ml-rating">
        <span class="ml-rating__score">4.8</span>
        <span class="ml-rating__stars">★★★★★</span>
        <span class="ml-rating__count">· 62 reviews</span>
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h2>By star</h2></div>
      <div class="ml-progress">
        <span class="ml-progress__title">5 stars</span>
        <span class="ml-progress__meta">48</span>
        <span class="ml-progress__track"><span class="ml-progress__fill" style="width:77%"></span></span>
      </div>
      <div class="ml-progress">
        <span class="ml-progress__title">4 stars</span>
        <span class="ml-progress__meta">10</span>
        <span class="ml-progress__track"><span class="ml-progress__fill" style="width:16%"></span></span>
      </div>
      <div class="ml-progress">
        <span class="ml-progress__title">3 stars</span>
        <span class="ml-progress__meta">3</span>
        <span class="ml-progress__track"><span class="ml-progress__fill" style="width:5%"></span></span>
      </div>
      <div class="ml-progress">
        <span class="ml-progress__title">2 stars</span>
        <span class="ml-progress__meta">1</span>
        <span class="ml-progress__track"><span class="ml-progress__fill" style="width:2%"></span></span>
      </div>
      <div class="ml-progress">
        <span class="ml-progress__title">1 star</span>
        <span class="ml-progress__meta">0</span>
        <span class="ml-progress__track"><span class="ml-progress__fill" style="width:0%"></span></span>
      </div>

      <div class="ml-section" style="margin-top:var(--space-3)"><h2>By category</h2></div>
      <div class="ml-summary__row"><span>Communication</span><span>4.9</span></div>
      <div class="ml-summary__row"><span>Punctuality</span><span>4.9</span></div>
      <div class="ml-summary__row"><span>Musicianship</span><span>4.8</span></div>
      <div class="ml-summary__row"><span>Value</span><span>4.6</span></div>
    </main>
  </div>
  <script src="/preview/shared/app-shell.js" defer></script>
</body>
</html>
