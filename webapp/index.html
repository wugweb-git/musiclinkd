<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Absolute paths — see shared/app-shell.js's MOUNT_BASE comment: cleanUrls
     +trailingSlash:false means a page with no trailing slash resolves
     relative paths against the wrong base. -->
<link rel="manifest" href="/preview/manifest.json" />
<link rel="icon" href="/preview/shared/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Flow / Screen Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Unica+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  /* Workbench layout: sidebar (flow/screen list) + main (phone-frame preview
     iframe), split on desktop. Below 800px there's no room for a split —
     the sidebar becomes a full-width overlay drawer instead of a column. */
  html, body { overflow: visible; } /* app-shell.css sets overflow:hidden for single-screen pages; this is a two-pane workbench, not one */
  .workbench { display: flex; height: 100dvh; }

  .wb-sidebar {
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--color-line);
    overflow-y: auto;
    background: #fff;
    padding: var(--space-3);
    transition: transform var(--duration-3) cubic-bezier(0.32,0.72,0,1);
  }
  .wb-sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
  .wb-hint { font-size: var(--type-1); color: var(--color-muted); margin: 0 0 var(--space-3); }

  .wb-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EFEFF3;
    overflow: auto;
    padding: var(--space-4);
    position: relative;
  }
  .wb-main .phone-frame { flex-shrink: 0; }
  .wb-empty { color: var(--color-muted); text-align: center; font-size: var(--type-2); }

  .wb-toolbar { display: none; }   /* desktop: sidebar is always visible, nothing to open */
  .wb-menu-btn { display: none; }
  /* Scrim uses the system's own backdrop token rather than a hand-picked
     rgba — --color-scrim is exactly this, at the documented opacity. */
  .wb-scrim { display: none; position: fixed; inset: 0; background: var(--color-scrim); z-index: 39; }

  @media (max-width: 800px) {
    .wb-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: min(340px, 88vw);
      transform: translateX(-100%);
      box-shadow: var(--elevation-2);
    }
    .wb-sidebar.is-open { transform: translateX(0); }
    .wb-sidebar.is-open ~ .wb-scrim { display: block; }
    /* The phone frame is a COLUMN under the toolbar, not the whole viewport.
       It used to be height:100dvh with the menu button position:fixed on top
       of it at z-index 41 — so the workbench's own burger sat over the
       previewed screen's back button and app bar, and the two were
       indistinguishable. The toolbar now occupies its own row and the frame
       takes the remaining height, so nothing overlaps anything. */
    .wb-main { padding: 0; flex-direction: column; align-items: stretch; justify-content: flex-start; }
    .wb-toolbar {
      display: flex; align-items: center; gap: var(--space-2);
      flex: 0 0 auto;
      padding: calc(var(--space-2) + env(safe-area-inset-top,0px)) var(--space-2) var(--space-2);
      background: var(--color-white);
      border-bottom: 1px solid var(--color-line);
    }
    .wb-main .phone-frame { width: 100%; max-width: 100%; flex: 1; min-height: 0; height: auto; border-radius: 0; padding: 0; background: transparent; box-shadow: none; }
    .wb-main .phone-screen { height: 100%; border-radius: 0; }
    .wb-menu-btn {
      display: flex; align-items: center; justify-content: center;
      width: var(--size-3); height: var(--size-3); border-radius: var(--radius-4);
      background: var(--color-surface); color: var(--color-ink);
      border: none; cursor: pointer; flex: none;
    }
    .wb-toolbar__title { font-size: var(--type-1); color: var(--color-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  h1 { font: 700 var(--type-3)/1.3 'Inter Tight', sans-serif; margin: var(--space-2) 0 0; }
  .flow-group { margin-bottom: var(--space-3); }
  .flow-group summary { font: 600 var(--type-2)/1.4 'Inter', sans-serif; cursor: pointer; padding: var(--space-2) 0; list-style: none; display: flex; align-items: center; gap: var(--space-1); }
  .flow-group summary::-webkit-details-marker { display: none; }
  .flow-group summary::before { content: "▸"; color: var(--color-muted); transition: transform var(--duration-2); font-size: var(--type-1); }
  .flow-group[open] summary::before { transform: rotate(90deg); }
  .flow-status { font-size: var(--type-1); padding: 2px var(--space-2); border-radius: var(--radius-4); margin-left: auto; }
  /* These three label a screen's build status and ARE product UI, so they
     derive from tokens like every other status in the system — the same
     color-mix .ml-status--warning / --info / --error use. They were the last
     hand-rolled status pairs in the tree. */
  .status-partial    { background: color-mix(in srgb, var(--color-warning) 18%, var(--color-white));
                       color:      color-mix(in srgb, var(--color-warning) 50%, black); }
  .status-app-mocked { background: color-mix(in srgb, var(--color-info) 12%, var(--color-white));
                       color:      color-mix(in srgb, var(--color-info) 72%, black); }
  .status-missing    { background: color-mix(in srgb, var(--color-error) 12%, var(--color-white));
                       color:      color-mix(in srgb, var(--color-error) 72%, black); }
  .screen-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 var(--space-3); }
  .screen-list li a { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2); text-decoration: none; color: var(--color-ink); font-size: var(--type-2); border-radius: var(--radius-1); }
  .screen-list li a:hover, .screen-list li a.active { background: var(--color-pink-container); color: var(--color-pink); }
  .screen-num { color: var(--color-muted); font-variant-numeric: tabular-nums; font-size: var(--type-1); min-width: 20px; }
  .empty-flow { font-size: var(--type-1); color: var(--color-muted); padding: var(--space-1) var(--space-2); }

  /* Designed vs stub. 103 of 124 screens are still unfilled templates, and
     without this you cannot tell which is which until you click one -- the
     single most confusing thing about this workbench. */
  .screen-state { margin-left: auto; font-size: var(--type-1); flex-shrink: 0; }
  .screen-state.is-stub { color: var(--color-muted); }
  .screen-state.is-designed { color: var(--color-ink, #0D0D0D); font-weight: 700; }
  .screen-list li a.is-stub { color: var(--color-muted); }
  .wb-filter { display: flex; gap: 6px; margin-bottom: var(--space-2); }
  .wb-filter button {
    flex: 1; padding: 6px 8px; font-size: var(--type-1); font-family: var(--font-body);
    border: 1px solid var(--color-line); border-radius: var(--radius-4); background: #fff;
    cursor: pointer; color: var(--color-muted);
  }
  .wb-filter button.active { background: var(--color-ink, #0D0D0D); border-color: var(--color-ink, #0D0D0D); color: #fff; font-weight: 600; }
  .wb-search {
    width: 100%; min-height: 38px; padding: 0 var(--space-3); margin-bottom: var(--space-2);
    border: 1px solid var(--color-line); border-radius: var(--radius-4);
    font-size: var(--type-2); font-family: var(--font-body);
  }
  .wb-count { font-size: var(--type-1); color: var(--color-muted); margin-bottom: var(--space-2); }
</style>
</head>
<body>
<div class="workbench">
  <aside class="wb-sidebar" id="sidebar">
    <div class="wb-sidebar-header">
      <!-- Real mark (frontend/guide/brand/assets/favicon-mark.svg), not typography-only
           as before. currentColor so it inherits --black from the surrounding text color. -->
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="20" height="20" viewBox="0 0 641 550" style="display:block;color:var(--color-ink);flex:none;" aria-hidden="true">
          <path fill="currentColor" d="M625 0C633.837 0 641 7.16344 641 16V534C641 542.837 633.837 550 625 550H16C7.16344 550 5.83896e-08 542.837 0 534V16C0 7.16344 7.16344 2.01329e-09 16 0H625ZM485.763 136.924C479.896 127.395 459.413 118.285 448.231 120.276C426.532 124.141 413.82 138.417 408.354 158.445C396.505 201.869 386.374 245.765 374.362 289.141C371.237 300.425 365.536 312.063 357.874 320.766C347.066 333.042 333.299 341.456 314.788 337.963C290.774 333.431 276.661 317.963 270.636 296.337C258.921 254.287 248.645 211.796 239.122 169.186C231.106 133.317 199.722 111.036 171.475 125.983C160.301 131.896 151.246 146.384 146.553 158.958C139.054 179.05 136.444 200.921 130.956 221.826C124.368 246.92 117.51 271.974 109.669 296.696C103.655 315.657 91.4896 329.477 72.1992 337.056C66.5382 339.28 59.413 345.445 58.5059 350.753C55.0657 370.885 53.5303 391.379 52.0723 411.795C51.5155 419.591 54.0668 427.373 63.8135 427.801C79.5225 428.491 94.9065 427.207 107.599 414.577C108.171 414.008 108.654 413.352 109.06 412.654C113.744 404.589 118.453 397.453 121.527 389.672C140.346 342.045 204.397 319.918 244.057 368.228C251.637 377.461 255.597 389.706 263.311 398.789C272.122 409.164 281.791 420.89 293.683 426.155C323.212 439.229 361.834 424.595 379.11 397.195C389.817 380.215 396.839 361.185 417.142 350.783C448.747 334.591 489.962 342.632 509.545 372.291C516.951 383.508 522.417 396.007 529.793 407.247C539.995 422.794 555.596 428.233 573.311 425.545C577.651 424.886 583.685 418.737 584.478 414.312C587.342 398.312 588.763 382.001 589.858 365.748C590.981 349.096 585.515 342.559 570.019 336.941C563.686 334.646 557.077 331.088 552.504 326.282C522.062 294.291 520.275 251.124 510.223 211.594C503.711 185.988 499.895 159.878 485.763 136.924Z"/>
        </svg>
        <div class="ml-wordmark" style="font-size:var(--type-2);">MUSIC<em>LINKD</em></div>
      </div>
    </div>
    <h1 style="font-size:var(--type-2);">Flow / Screen Index</h1>
    <p class="wb-hint">Generated from the live flow/schema registry. Tap a screen to preview it on the right.</p>
    <input type="search" id="wb-search" class="wb-search" placeholder="Filter screens..." aria-label="Filter screens" />
    <div class="wb-filter" role="group" aria-label="Filter by build state">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="designed">Designed</button>
      <button type="button" data-filter="stub">Stubs</button>
    </div>
    <div class="wb-count" id="wb-count"></div>
    <div id="flow-list"></div>
  </aside>
  <div class="wb-scrim" id="scrim"></div>

  <main class="wb-main" id="main">
    <!-- Workbench toolbar. Only rendered below 800px, where the sidebar
         collapses into a drawer; on desktop the sidebar is always visible so
         there is nothing to open and the whole row is display:none. -->
    <div class="wb-toolbar">
      <button class="wb-menu-btn" id="menu-btn" aria-label="Open screen list">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <span class="wb-toolbar__title" id="wb-toolbar-title">Screen preview</span>
    </div>
    <!-- 20:9 phone-frame mockup. A device selector (Pixel 7/iPhone 14 Pro/
         Galaxy S23) used to sit here — removed 2026-08-16 rather than
         fixed: it was found completely non-functional on re-audit (no
         click handler ever existed, .phone-frame never got the
         data-device attribute the CSS keyed off), and a single real,
         standard 360×800 frame is a reasonable fixed baseline rather than
         reintroducing three sizes' worth of surface area to maintain. -->
  <div class="phone-frame" id="phone-frame">
    <div class="phone-notch">
      <div class="dot"></div>
    </div>
    <div class="phone-status">
      <div class="carrier">MusicLinkd</div>
      <div class="battery">100%</div>
    </div>
    <iframe id="preview-frame" title="Screen preview" src="about:blank"></iframe>
  </div>

  <style>
    /* 20:9 device frame — standardized across all supported phones.
       The aspect-ratio + safe-area insets are driven by CSS vars set by
       the device-selector JS below. All phones share the same visual
       language: black border, pill-shaped notch, centered carrier/battery. */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 360px; /* Pixel 7 baseline; other devices scale via aspect-ratio */
      aspect-ratio: 9 / 20; /* 20:9 — 360×800 base; iPhone 14 Pro → 390×844 via scale */
      /* HARDWARE, not product UI. This is the phone bezel; #2C2F3A below is
         the camera lens and #FFD60A is iOS's low-power battery yellow. They
         depict the device the app runs ON. Putting them on MusicLinkd's
         palette would make the workbench look like a MusicLinkd screen
         rather than like a phone, which is the opposite of the point, so
         they are exempt in audit-screens deliberately — not overlooked. */
      background: #1a1a2e;
      border-radius: 36px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .phone-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(rgba(0,0,0,0.3) 0%, transparent 100%);
      pointer-events: none;
    }
    /* Notch — fixed shape/position for the single supported 360×800 frame. */
    .phone-notch {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 36px; height: 24px;
      background: #0D0D0D;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; pointer-events: none;
    }
    .phone-notch .dot {
      width: 6px; height: 6px;
      background: #2C2F3A; border-radius: 50%;
      pointer-events: none;
    }
    /* Status bar — carrier + battery, fixed for the single supported frame. */
    .phone-status {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 0 14px; height: 24px;
      display: flex; justify-content: space-between;
      align-items: center; font-size: 10px; font-weight: 600;
      color: #fff; pointer-events: none;
    }
    .phone-status .carrier { color: #888; }
    .phone-status .battery { display: flex; align-items: center; gap: 2px; }
    .phone-status .battery div {
      width: 16px; height: 8px;
      background: #FFD60A; border-radius: 2px;
    }
    /* Screen content lives in this iframe. It used to be an unstyled bare
       child of .phone-frame with no width/height rule reaching it at all
       (the old CSS targeted ".phone-screen iframe", a class that doesn't
       exist anywhere in this markup) — so it rendered at the browser's
       default replaced-element size (~300×150px) and every preview showed
       as a small clipped box in the top-left of the frame instead of
       filling the device outline. Positioned + sized explicitly here,
       starting below the status bar and filling the rest of the frame. */
    #preview-frame {
      position: absolute;
      inset: 24px 0 0 0;
      width: 100%;
      height: calc(100% - 24px);
      border: 0;
      display: block;
      background: var(--color-paper, #fff);
      border-radius: 0 0 34px 34px;
    }
  </style>
  </main>
</div>

<script src="/preview/shared/app-shell.js" defer></script>
<script>
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  const menuBtn = document.getElementById("menu-btn");
  const frame = document.getElementById("preview-frame");

  function openSidebar() { sidebar.classList.add("is-open"); }
  function closeSidebar() { sidebar.classList.remove("is-open"); }
  menuBtn.addEventListener("click", openSidebar);
  scrim.addEventListener("click", closeSidebar);

  function selectScreen(url, linkEl) {
    frame.src = url;
    document.querySelectorAll(".screen-list a.active").forEach((a) => a.classList.remove("active"));
    if (linkEl) linkEl.classList.add("active");
    // Name the screen in the mobile toolbar. Without it the toolbar is a bare
    // burger with no indication of what is being previewed.
    const title = document.getElementById("wb-toolbar-title");
    if (title) title.textContent = linkEl?.dataset.title || "Screen preview";
    closeSidebar();
    history.replaceState(null, "", "/preview/?screen=" + encodeURIComponent(url));
  }

  // Which screens are real designs vs untouched templates. Generated by the
  // snippet in webapp/README.md; regenerate after designing a screen.
  const designedReq = fetch("/preview/data/designed-screens.json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : { designed: [] }))
    .catch(() => ({ designed: [] }));

  Promise.all([
    fetch("/preview/data/flows-map.json", { cache: "no-store" }).then((r) => r.json()),
    designedReq,
  ])
    .then(([data, designedData]) => {
      const DESIGNED = new Set(designedData.designed ?? []);
      const container = document.getElementById("flow-list");
      const byFlow = {};
      for (const s of data.screens) (byFlow[s.flowKey] ??= []).push(s);

      const sorted = [...data.flows].sort((a, b) => a.order - b.order);
      let firstUrl = null;

      const params = new URLSearchParams(window.location.search);
      const preselect = params.get("screen");

      for (const flow of sorted) {
        const details = document.createElement("details");
        details.className = "flow-group";
        const screens = (byFlow[flow.key] ?? []).sort((a, b) => a.screenOrder - b.screenOrder);
        details.open = screens.length > 0 && screens.length <= 15;

        const summary = document.createElement("summary");
        summary.innerHTML = `${flow.order}. ${flow.title} <span class="flow-status status-${flow.status}">${flow.status}</span>`;
        details.appendChild(summary);

        if (screens.length === 0) {
          const p = document.createElement("p");
          p.className = "empty-flow";
          p.textContent = flow.description;
          details.appendChild(p);
        } else {
          const ul = document.createElement("ul");
          ul.className = "screen-list";
          for (const screen of screens) {
            const url = `/preview/flows/${screen.flowKey}/${screen.screenKey}/index.html`;
            if (!firstUrl) firstUrl = url;
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = url;
            const isDesigned = DESIGNED.has(`${screen.flowKey}/${screen.screenKey}`);
            if (!isDesigned) a.classList.add("is-stub");
            a.dataset.state = isDesigned ? "designed" : "stub";
            a.dataset.search = `${screen.screenTitle} ${screen.screenKey} ${flow.title}`.toLowerCase();
            // Stored so the mobile toolbar can name the screen without
            // scraping the link's rendered text, which concatenates the
            // number and the Designed/Stub chip into "1HomeStub".
            a.dataset.title = flow.title === screen.screenTitle
              ? screen.screenTitle
              : `${flow.title} · ${screen.screenTitle}`;
            a.innerHTML = `<span class="screen-num">${screen.screenNumber ?? "-"}</span>` +
              `<span>${screen.screenTitle}</span>` +
              `<span class="screen-state ${isDesigned ?"is-designed" : "is-stub"}">` +
              `${isDesigned ? "Designed" : "Stub"}</span>`;
            a.addEventListener("click", (e) => {
              e.preventDefault();
              selectScreen(url, a);
            });
            if (preselect === url) { firstUrl = url; selectScreen(url, a); }
            li.appendChild(a);
            ul.appendChild(li);
          }
          details.appendChild(ul);
        }
        container.appendChild(details);
      }

      // Minor edge case fixed on the same re-audit: this used to load
      // `preselect` unconditionally whenever the loop above never matched
      // it (e.g. a stale/hand-edited ?screen= pointing at a screen that no
      // longer exists) — silently showing a broken iframe instead of
      // falling back to the first real screen the way a truly-empty
      // ?screen= already does.
      // --- search + designed/stub filter -------------------------------
      const searchEl = document.getElementById("wb-search");
      const countEl = document.getElementById("wb-count");
      const filterBtns = [...document.querySelectorAll(".wb-filter button")];
      let mode = "all";

      function applyFilter() {
        const q = (searchEl.value || "").trim().toLowerCase();
        let shown = 0;
        for (const a of document.querySelectorAll(".screen-list a")) {
          const okMode = mode === "all" || a.dataset.state === mode;
          const okText = !q || (a.dataset.search || "").includes(q);
          const show = okMode && okText;
          a.parentElement.hidden = !show;
          if (show) shown++;
        }
        // Collapse flows with nothing left visible, so the list does not fill
        // with empty group headers while filtering.
        for (const grp of document.querySelectorAll(".flow-group")) {
          const any = [...grp.querySelectorAll(".screen-list li")].some((li) => !li.hidden);
          grp.hidden = grp.querySelector(".screen-list") ? !any : false;
          if (any && (q || mode !== "all")) grp.open = true;
        }
        const total = document.querySelectorAll(".screen-list a").length;
        const designed = document.querySelectorAll('.screen-list a[data-state="designed"]').length;
        countEl.textContent = `${shown} of ${total} screens · ${designed} designed, ${total - designed} stubs`;
      }

      searchEl.addEventListener("input", applyFilter);
      filterBtns.forEach((b) =>
        b.addEventListener("click", () => {
          filterBtns.forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          mode = b.dataset.filter;
          applyFilter();
        })
      );
      applyFilter();

      if (!frame.src || frame.src === "about:blank") {
        if (preselect && sorted.some((f) => (byFlow[f.key] ?? []).some((s) => `/preview/flows/${s.flowKey}/${s.screenKey}/index.html` === preselect))) {
          frame.src = preselect;
        } else if (firstUrl) {
          frame.src = firstUrl;
        }
      }
    })
    .catch((err) => {
      document.getElementById("flow-list").textContent = "Could not load the flow/screen registry — run the generator first.";
      console.error(err);
    });
</script>
</body>
</html>
