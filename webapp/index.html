<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Absolute paths — see shared/app-shell.js's MOUNT_BASE comment: cleanUrls
     +trailingSlash:false means a page with no trailing slash resolves
     relative paths against the wrong base. -->
<link rel="manifest" href="/preview/manifest.json" />
<link rel="apple-touch-icon" href="/preview/shared/icon.svg" />
<title>MusicLinkd — Flow / Screen Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/preview/shared/app-shell.css" />
<link rel="stylesheet" href="/preview/shared/tokens.css" />
<style>
  /* Workbench layout: sidebar (flow/screen list) + main (phone-frame preview
     iframe), split on desktop. Below 800px there's no room for a split —
     the sidebar becomes a full-width overlay drawer instead of a column. */
  html, body { overflow: visible; } /* app-shell.css sets overflow:hidden for single-screen pages; this is a two-pane workbench, not one */
  .workbench { display: flex; height: 100dvh; }

  .wb-sidebar {
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    background: #fff;
    padding: var(--space-3);
    transition: transform var(--duration-3) cubic-bezier(0.32,0.72,0,1);
  }
  .wb-sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
  .wb-hint { font-size: var(--type-1); color: var(--muted); margin: 0 0 var(--space-3); }

  .wb-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EFEFF3;
    overflow: auto;
    padding: var(--space-4);
    position: relative;
  }
  .wb-main .phone-frame { flex-shrink: 0; }
  .wb-main .phone-screen iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
  .wb-empty { color: var(--muted); text-align: center; font-size: var(--type-2); }

  .wb-menu-btn { display: none; }
  .wb-scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 39; }

  @media (max-width: 800px) {
    .wb-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: min(340px, 88vw);
      transform: translateX(-100%);
      box-shadow: var(--shadow-4);
    }
    .wb-sidebar.is-open { transform: translateX(0); }
    .wb-sidebar.is-open ~ .wb-scrim { display: block; }
    .wb-main { padding: 0; }
    .wb-main .phone-frame { width: 100%; max-width: 100%; height: 100dvh; border-radius: 0; padding: 0; background: transparent; box-shadow: none; }
    .wb-main .phone-screen { height: 100%; border-radius: 0; }
    .wb-menu-btn {
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: calc(var(--space-2) + env(safe-area-inset-top,0px)); left: var(--space-2);
      z-index: 41; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.9); box-shadow: var(--shadow-2); border: none; cursor: pointer;
    }
  }

  h1 { font: 700 var(--type-3)/1.3 'Inter Tight', sans-serif; margin: var(--space-2) 0 0; }
  .flow-group { margin-bottom: var(--space-3); }
  .flow-group summary { font: 600 var(--type-2)/1.4 'Inter', sans-serif; cursor: pointer; padding: var(--space-2) 0; list-style: none; display: flex; align-items: center; gap: var(--space-1); }
  .flow-group summary::-webkit-details-marker { display: none; }
  .flow-group summary::before { content: "▸"; color: var(--muted); transition: transform var(--duration-2); font-size: var(--type-1); }
  .flow-group[open] summary::before { transform: rotate(90deg); }
  .flow-status { font-size: var(--type-1); padding: 2px var(--space-2); border-radius: var(--radius-4); margin-left: auto; }
  .status-partial { background: #FEF3C7; color: #92400E; }
  .status-app-mocked { background: #DBEAFE; color: #1E40AF; }
  .status-missing { background: #FEE2E2; color: #991B1B; }
  .screen-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 var(--space-3); }
  .screen-list li a { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2); text-decoration: none; color: var(--black); font-size: var(--type-2); border-radius: var(--radius-1); }
  .screen-list li a:hover, .screen-list li a.active { background: var(--pink-container); color: var(--pink); }
  .screen-num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: var(--type-1); min-width: 20px; }
  .empty-flow { font-size: var(--type-1); color: var(--muted); padding: var(--space-1) var(--space-2); }
</style>
</head>
<body>
<div class="workbench">
  <aside class="wb-sidebar" id="sidebar">
    <div class="wb-sidebar-header">
      <div class="brand-wordmark" style="font-size:var(--type-2);">MusicLink<em>d</em></div>
    </div>
    <h1 style="font-size:var(--type-2);">Flow / Screen Index</h1>
    <p class="wb-hint">Generated from the live flow/schema registry. Tap a screen to preview it on the right.</p>
    <div id="flow-list"></div>
  </aside>
  <div class="wb-scrim" id="scrim"></div>

  <main class="wb-main" id="main">
    <button class="wb-menu-btn" id="menu-btn" aria-label="Open screen list">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <!-- Device selector + 20:9 phone-frame mockup -->
  <div class="wb-device-selector" style="display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:var(--space-2)">
    <button class="wb-device-btn" data-device="pixel7" aria-label="Pixel 7 (360×800)">📱 Pixel 7</button>
    <button class="wb-device-btn wb-device-btn--active" data-device="iphone14" aria-label="iPhone 14 Pro (390×844)">📱 iPhone 14 Pro</button>
    <button class="wb-device-btn" data-device="galaxys23" aria-label="Galaxy S23 (308×656)">📱 Galaxy S23</button>
  </div>

  <div class="phone-frame" style="--device: pixel7">
    <div class="phone-notch" style="--device: pixel7">
      <div class="dot" style="--device: pixel7"></div>
    </div>
    <div class="phone-status" style="--device: pixel7">
      <div class="carrier">MusicLinkd</div>
      <div class="battery">100%</div>
    </div>
    <iframe id="preview-frame" title="Screen preview" src="about:blank" style="--device: pixel7"></iframe>
    <div class="phone-body" style="--device: pixel7">
      <div style="position:relative;inset:0;border-radius:26px;overflow:hidden">
        <!-- screen content via iframe -->
      </div>
    </div>
  </div>

  <style>
    /* 20:9 device frame — standardized across all supported phones.
       The aspect-ratio + safe-area insets are driven by CSS vars set by
       the device-selector JS below. All phones share the same visual
       language: black border, pill-shaped notch, centered carrier/battery. */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 360px; /* Pixel 7 baseline; other devices scale via aspect-ratio */
      aspect-ratio: 9 / 20; /* 20:9 — 360×800 base; iPhone 14 Pro → 390×844 via scale */
      background: #1a1a2e;
      border-radius: 36px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .phone-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(rgba(0,0,0,0.3) 0%, transparent 100%);
      pointer-events: none;
    }
    /* Notch — same shape, position driven by --device CSS var */
    .phone-notch {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 36px; height: 24px;
      background: #0D0D0D;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; pointer-events: none;
    }
    .phone-notch .dot {
      width: 6px; height: 6px;
      background: #2C2F3A; border-radius: 50%;
      pointer-events: none;
    }
    /* Status bar — carrier + battery, position driven by --device */
    .phone-status {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 0 14px; height: 24px;
      display: flex; justify-content: space-between;
      align-items: center; font-size: 10px; font-weight: 600;
      color: #fff; pointer-events: none;
    }
    .phone-status .carrier { color: #888; }
    .phone-status .battery { display: flex; align-items: center; gap: 2px; }
    .phone-status .battery div {
      width: 16px; height: 8px;
      background: #FFD60A; border-radius: 2px;
    }
    /* Body — the actual screen content lives inside the iframe */
    .phone-body { padding: 12px; }
    /* Device selector buttons */
    .wb-device-selector { margin-bottom: var(--space-2); }
    .wb-device-btn {
      font: 600 11px/1 'Inter', sans-serif;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 150ms var(--ease);
      white-space: nowrap;
    }
    .wb-device-btn:hover { background: #F8F8FB; }
    .wb-device-btn--active {
      color: var(--pink);
      border-color: var(--pink);
      background: var(--pink-container);
    }
    /* Aspect-ratio override per device — set by JS */
    .phone-frame[data-device="iphone14"] { aspect-ratio: 9 / 20; max-width: 390px; }
    .phone-frame[data-device="galaxys23"] { aspect-ratio: 9 / 20; max-width: 308px; }
  </style>
  </main>
</div>

<script src="/preview/shared/app-shell.js" defer></script>
<script>
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  const menuBtn = document.getElementById("menu-btn");
  const frame = document.getElementById("preview-frame");

  function openSidebar() { sidebar.classList.add("is-open"); }
  function closeSidebar() { sidebar.classList.remove("is-open"); }
  menuBtn.addEventListener("click", openSidebar);
  scrim.addEventListener("click", closeSidebar);

  function selectScreen(url, linkEl) {
    frame.src = url;
    document.querySelectorAll(".screen-list a.active").forEach((a) => a.classList.remove("active"));
    if (linkEl) linkEl.classList.add("active");
    closeSidebar();
    history.replaceState(null, "", "/preview/?screen=" + encodeURIComponent(url));
  }

  fetch("/preview/data/flows-map.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((data) => {
      const container = document.getElementById("flow-list");
      const byFlow = {};
      for (const s of data.screens) (byFlow[s.flowKey] ??= []).push(s);

      const sorted = [...data.flows].sort((a, b) => a.order - b.order);
      let firstUrl = null;

      const params = new URLSearchParams(window.location.search);
      const preselect = params.get("screen");

      for (const flow of sorted) {
        const details = document.createElement("details");
        details.className = "flow-group";
        const screens = (byFlow[flow.key] ?? []).sort((a, b) => a.screenOrder - b.screenOrder);
        details.open = screens.length > 0 && screens.length <= 15;

        const summary = document.createElement("summary");
        summary.innerHTML = `${flow.order}. ${flow.title} <span class="flow-status status-${flow.status}">${flow.status}</span>`;
        details.appendChild(summary);

        if (screens.length === 0) {
          const p = document.createElement("p");
          p.className = "empty-flow";
          p.textContent = flow.description;
          details.appendChild(p);
        } else {
          const ul = document.createElement("ul");
          ul.className = "screen-list";
          for (const screen of screens) {
            const url = `/preview/flows/${screen.flowKey}/${screen.screenKey}/index.html`;
            if (!firstUrl) firstUrl = url;
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = url;
            a.innerHTML = `<span class="screen-num">${screen.screenNumber ?? "—"}</span>${screen.screenTitle}`;
            a.addEventListener("click", (e) => {
              e.preventDefault();
              selectScreen(url, a);
            });
            if (preselect === url) { firstUrl = url; selectScreen(url, a); }
            li.appendChild(a);
            ul.appendChild(li);
          }
          details.appendChild(ul);
        }
        container.appendChild(details);
      }

      if (!frame.src || frame.src === "about:blank") {
        if (preselect) { frame.src = preselect; }
        else if (firstUrl) { frame.src = firstUrl; }
      }
    })
    .catch((err) => {
      document.getElementById("flow-list").textContent = "Could not load the flow/screen registry — run the generator first.";
      console.error(err);
    });
</script>
</body>
</html>
