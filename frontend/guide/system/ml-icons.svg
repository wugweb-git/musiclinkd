  <symbol> elements into guide/system/ml-icons.svg.
     Replaces: 🎹 x3 (which was doing duty for BOTH keyboard and piano) · 🥁 🎧 🎛 🎼 🪘 🧑 🔐 ⚡ 🎸

     DELIBERATELY ONE GUITAR, NOT THREE. The first attempt drew acoustic, electric
     and bass separately; rendered at 24px they were three near-identical shapes —
     which reproduces the exact problem the emoji had, where one 🎸 served both
     Acoustic and Bass Guitar. At icon scale the body outline is all that survives,
     so the distinction cannot be carried by the glyph. The screens already print
     "Acoustic Guitar" and "Bass Guitar" next to it; the label carries the meaning
     and the icon carries the category. Fewer, clearer glyphs beat more, muddier ones.

     NO HANDSHAKE EITHER. 🤝 appeared once, on the networking feed. The set already
     has `people`, which says the same thing and is already recycled. A new glyph
     used once is a backlog entry waiting to happen. -->
